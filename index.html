s="progress-track mint"><span style="width:${Math.min(100,p.budget?p.actualCost/p.budget*100:0)}%"></span></div></div><div class="member-cell" style="margin-top:15px;flex-wrap:wrap">${[...new Set(tasks.map(t=>t.assignee).filter(Boolean))].slice(0,6).map(n=>`${avatar(n,'sm')}<span>${esc(n)}</span>`).join('')||'<span>Belum ada anggota ditugaskan</span>'}</div></section></div><div class="page-grid-2"><section class="card table-card"><div class="toolbar"><div><h3>Risiko prioritas</h3></div><button class="link-button" data-action="detail-tab" data-tab="risks">Semua risiko ${icon('arrow',11)}</button></div>${riskTable(p.id)}</section><section class="card card-pad"><div class="section-title"><div><h2>Audit trail</h2><p>Perubahan penting terbaru</p></div></div>${auditList(p.id)}</section></div>`;else if(ui.detailTab==='work')body=`<section class="card table-card"><div class="toolbar"><div class="toolbar-left"><h3>${p.methodology==='agile'?'Task & backlog':'Work Breakdown Structure'}</h3><span class="chip">${tasks.length} pekerjaan</span></div><button class="btn primary tiny" data-action="new-task" data-project="${p.id}" data-agile="${p.methodology==='agile'}">${icon('plus',12)} Tambah pekerjaan</button></div>${taskTable(tasks,p.methodology)}</section>`;else if(ui.detailTab==='timeline')body=`<div class="page-grid-3"><div class="card mini-kpi"><span>Start / baseline</span><strong>${fmtDate(p.startDate)}</strong><small>Sisa sampai target: ${Math.max(0,Math.ceil((new Date(`${p.dueDate}T12:00:00`)-TODAY)/86400000))} hari</small></div><div class="card mini-kpi"><span>Target selesai</span><strong>${fmtDate(p.dueDate)}</strong><small>Progres ${Math.round(p.actualProgress)}% · rencana ${Math.round(p.plannedProgress)}%</small></div><div class="card mini-kpi"><span>Milestone</span><strong>${db.milestones.filter(m=>m.projectId===p.id&&m.status==='Done').length}/${db.milestones.filter(m=>m.projectId===p.id).length}</strong><small>Milestone selesai</small></div></div><section class="card table-card"><div class="toolbar"><div><h3>Jadwal proyek / Gantt</h3><span class="tiny-text">Task dependencies tersimpan pada edit task.</span></div><button class="btn tiny" data-action="new-milestone" data-project="${p.id}">${icon('plus',12)} Milestone</button></div>${ganttMarkup(p,tasks)}</section><section class="card table-card" style="margin-top:14px"><div class="toolbar"><h3>Milestone & deliverables</h3></div>${milestoneTable(p.id)}</section>`;else if(ui.detailTab==='risks')body=`<section class="card table-card" style="margin-bottom:14px"><div class="toolbar"><div class="toolbar-left"><h3>Daftar risiko</h3><span class="chip">${db.risks.filter(r=>r.projectId===p.id).length} risiko</span></div><button class="btn primary tiny" data-action="new-risk" data-project="${p.id}">${icon('plus',12)} Risiko</button></div>${riskTable(p.id)}</section><section class="card table-card"><div class="toolbar"><div class="toolbar-left"><h3>Log isu & defect</h3><span class="chip">${db.issues.filter(i=>i.projectId===p.id&&!['Resolved','Closed'].includes(i.status)).length} terbuka</span></div><button class="btn primary tiny" data-action="new-issue" data-project="${p.id}">${icon('plus',12)} Issue</button></div>${issueTable(p.id)}</section>`;else body=renderGovernance(p);return `${heading('Detail proyek','Pantau kondisi, progres, EVM, risiko, tim, dan keputusan proyek.',actions,'PROJECT · '+esc(p.code))}<div class="detail-hero">${projectMark(p)}<div><h1>${esc(p.name)}</h1><p>${esc(p.manager)} · ${fmtDate(p.startDate)} — ${fmtDate(p.dueDate)}</p></div><div class="detail-meta" style="margin-left:auto">${methodologyTag(p.methodology)}${statusPill(health(p))}${priorityTag(p.priority)}</div></div><div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${ui.detailTab===k?'active':''}" data-action="detail-tab" data-tab="${k}">${l}</button>`).join('')}</div>${body}`}
function auditList(pid=''){const list=db.audit.filter(a=>!pid||a.projectId===pid||!a.projectId).slice(0,5);return list.length?`<div class="audit-list">${list.map(a=>`<div class="audit-entry"><span class="audit-mark">${icon('check',11)}</span><div><strong>${esc(a.text)}</strong><span>${esc(a.user)} · ${fmtDate(a.date.slice(0,10))} ${a.date.includes('T')?a.date.slice(11,16):''}</span></div></div>`).join('')}</div>`:'<div class="empty-state"><strong>Belum ada aktivitas</strong></div>'}

.date)}</td><td class="tiny-text">${esc(d.rationale)}</td><td><button class="row-action" data-action="edit-decision" data-id="${d.id}" title="Edit">${icon('edit',12)}</button><button class="row-action" data-action="delete-decision" data-id="${d.id}" title="Hapus">${icon('trash',12)}</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><strong>Belum ada keputusan</strong></div>'}</section></div><div class="page-grid-2"><section class="card table-card"><div class="toolbar"><div><h3>Log komunikasi stakeholder</h3><span class="tiny-text">Catatan komunikasi, audience, dan tindak lanjut</span></div><button class="btn tiny" data-action="new-communication" data-project="${p.id}">${icon('plus',12)} Catat komunikasi</button></div>${comms.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Tanggal</th><th>Audience / channel</th><th>Ringkasan</th><th>Tindak lanjut</th><th>Aksi</th></tr></thead><tbody>${comms.map(c=>`<tr><td>${fmtDate(c.date)}</td><td>${esc(c.audience)}<div class="tiny-text">${esc(c.channel)}</div></td><td>${esc(c.summary)}</td><td class="tiny-text">${esc(c.followup||'—')}</td><td><button class="row-action" data-action="edit-communication" data-id="${c.id}" title="Edit">${icon('edit',12)}</button><button class="row-action" data-action="delete-communication" data-id="${c.id}" title="Hapus">${icon('trash',12)}</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><strong>Belum ada communication log</strong><span>Catat steering update, workshop, atau keputusan stakeholder.</span></div>'}</section><section class="card card-pad"><div class="section-title"><div><h2>Audit trail</h2><p>Aktivitas lintas proyek</p></div></div>${auditList(p.id)}</section></div>${p.methodology==='waterfall'?`<div class="page-grid-2"><section class="card table-card"><div class="toolbar"><h3>Requirements & approval</h3><button class="link-button" data-view="waterfall">Buka Waterfall workspace ${icon('arrow',10)}</button></div>${renderRequirements(p.id)}</section><section class="card table-card"><div class="toolbar"><h3>Dokumen & sign-off</h3><button class="link-button" data-view="waterfall">Buka dokumen ${icon('arrow',10)}</button></div>${renderDocuments(p.id)}</section></div>`:''}`}
function memberLoad(m){const tasks=db.tasks.filter(t=>t.assignee===m.name&&t.status!=='Done');const rem=tasks.reduce((a,t)=>a+Math.max(0,t.remainingHours!==undefined&&t.remainingHours!==null?Number(t.remainingHours):((Number(t.estimateHours)||16)-(Number(t.actualHours)||0))),0);const cap=(Number(m.capacity)||40)*2;return {tasks,rem,capacity:cap,pct:cap?Math.round(rem/cap*100):0}}
function renderTeam(){const active=db.members.filter(m=>m.active!==false);const over=active.filter(m=>memberLoad(m).pct>100).length;const actions=`<button class="btn primary" data-action="new-member">${icon('plus',14)} Tambah anggota</button>`;return `${heading('Tim & kapasitas','Pantau kapasitas, distribusi beban kerja, PIC, dan jam aktual.',actions)}<div class="stats-grid"><div class="card mini-kpi"><span>Anggota aktif</span><strong>${active.length}</strong><small>lintas seluruh proyek</small></div><div class="card mini-kpi"><span>Potensi over-allocation</span><strong style="color:${over?'#d45f64':'#239475'}">${over}</strong><small>kapasitas 2 minggu ke depan</small></div><div class="card mini-kpi"><span>Tugas belum selesai</span><strong>${db.tasks.filter(t=>t.status!=='Done').length}</strong><small>termasuk backlog & sprint aktif</small></div><div class="card mini-kpi"><span>Jam aktual tercatat</span><strong>${fmtNum(db.tasks.reduce((a,t)=>a+(Number(t.actualHours)||0),0))}h</strong><small>berdasarkan timesheet task demo</small></div></div><div class="page-grid-2"><section class="card card-pad"><div class="section-title"><div><h2>Beban kerja per anggota</h2><p>Sisa estimasi dibandingkan kapasitas dua minggu.</p></div><span class="chip">${active.length} orang</span></div><div class="page-grid-3" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0">${active.map(m=>{const l=memberLoad(m);const level=l.pct>100?'over':l.pct>=80?'warn':'';return `<div class="team-card card"><div class="team-head">${avatar(m.name)}<div class="team-info"><strong>${esc(m.name)}</strong><span>${esc(m.role)}</span></div><span class="workload-number" style="color:${l.pct>100?'#d76267':l.pct>=80?'#bf8a24':'#37445d'}">${l.pct}%</span></div><div class="workload-bar"><span class="${level}" style="width:${Math.min(100,l.pct)}%"></span></div><div class="workload-foot"><span>${l.rem}h sisa / ${l.capacity}h kapasitas</span><span>${l.tasks.length} task</span></div>${l.pct>100?'<div class="tiny-text" style="color:#d45f64;margin-top:7px">Over-allocation · pertimbangkan redistribusi.</div>':''}</div>`}).join('')}</div></section><section class="card table-card"><div class="toolbar"><div><h3>Anggota & peran</h3><span class="tiny-text">Tanggung jawab, kapasitas, dan informasi kontak</span></div><button class="btn tiny" data-action="new-member">${icon('plus',12)} Anggota</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Anggota</th><th>Peran / tanggung jawab</th><th>Kapasitas</th><th>Beban kerja</th><th>Keahlian</th><th></th></tr></thead><tbody>${active.map(m=>{const l=memberLoad(m);return `<tr><td><div class="member-cell">${avatar(m.name,'sm')}<span><b>${esc(m.name)}</b><small style="display:block;color:#9aa3b2">${esc(m.email||'')}</small></span></div></td><td>${esc(m.role)}</td><td>${m.capacity}h / minggu</td><td><span class="risk-score ${l.pct>100?'':l.pct>80?'medium':'low'}">${l.pct}%</span></td><td class="tiny-text">${esc(m.skills||'—')}</td><td><button class="row-action" data-action="edit-member" data-id="${m.id}">${icon('edit',12)}</button><button class="row-action" data-action="delete-member" data-id="${m.id}">${icon('trash',12)}</button></td></tr>`}).join('')}</tbody></table></div></section></div><section class="card table-card"><div class="toolbar"><div><h3>Penugasan & timesheet</h3><span class="tiny-text">Estimasi sisa, jam aktual, deadline, dan task owner</span></div><button class="btn tiny" data-action="new-task" data-project="${ui.currentProjectId}">${icon('plus',12)} Tugas</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Task / project</th><th>PIC</th><th>Due date</th><th>Estimasi</th><th>Aktual</th><th>Sisa</th><th>Status</th></tr></thead><tbody>${db.tasks.filter(t=>t.status!=='Done').slice().sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,12).map(t=>`<tr><td><b>${esc(t.title)}</b><div class="tiny-text">${esc(getProject(t.projectId)?.name||'')}</div></td><td>${esc(t.assignee||'Belum ditugaskan')}</td><td>${fmtDate(t.dueDate)}</td><td>${Number(t.estimateHours)||0}h</td><td>${Number(t.actualHours)||0}h</td><td>${Number(t.remainingHours)||0}h</td><td><select class="status-select" data-change="task-status" data-id="${t.id}">${TASK_STATUSES.map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${esc(uiLabel(s))}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></section>`}
const REPORT_TYPES=[['executive','Ringkasan eksekutif'],['status','Laporan status proyek'],['weekly','Laporan progres mingguan'],['monthly','Laporan progres bulanan'],['timeline','Jadwal & Gantt'],['sprint','Laporan sprint'],['budget','Laporan anggaran & biaya'],['evm','Laporan EVM'],['risks','Laporan risiko & isu'],['resources','Pemanfaatan sumber daya'],['milestones','Milestone & hasil kerja']];
function reportRange(period){if(period==='all')return {start:'1970-01-01',end:'2999-12-31',label:'Seluruh periode'};if(period==='week'){return {start:dateOffset(TODAY_ISO,-7),end:TODAY_ISO,label:`${fmtDate(dateOffset(TODAY_ISO,-7))} – ${fmtDate(TODAY_ISO)}`}}if(period==='quarter'){const q=Math.floor(TODAY.getMonth()/3)*3;const start=new Date(TODAY.getFullYear(),q,1);return {start:`${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-01`,end:TODAY_ISO,label:`Q${Math.floor(TODAY.getMonth()/3)+1} ${TODAY.getFullYear()}`}}if(period==='year'){return {start:`${TODAY.getFullYear()}-01-01`,end:TODAY_ISO,label:`YTD ${TODAY.getFullYear()}`}}return {start:dateOffset(TODAY_ISO,-30),end:TODAY_ISO,label:`${fmtDate(dateOffset(TODAY_ISO,-30))} – ${fmtDate(TODAY_ISO)}`}}
function reportData(){const f=ui.reportFilters;const range=reportRange(f.period);let projects=activeProjects();if(f.project!=='all')projects=projects.filter(p=>p.id===f.project);if(f.status!=='all')projects=projects.filter(p=>health(p)===f.status);if(f.member!=='all')projects=projects.filter(p=>p.manager===f.member||db.tasks.some(t=>t.projectId===p.id&&t.assignee===f.member));const ids=new Set(projects.map(p=>p.id));let tasks=db.tasks.filter(t=>ids.has(t.projectId)&&t.dueDate>=range.start&&t.dueDate<=range.end);if(f.member!=='all')tasks=tasks.filter(t=>t.assignee===f.member);if(f.sprint!=='all')tasks=tasks.filter(t=>t.sprintId===f.sprint);if(f.phase!=='all')tasks=tasks.filter(t=>t.phase===f.phase);let risks=db.risks.filter(r=>ids.has(r.projectId)&&r.dueDate>=range.start&&r.dueDate<=range.end);let issues=db.issues.filter(i=>ids.has(i.projectId)&&i.dueDate>=range.start&&i.dueDate<=range.end);if(f.member!=='all'){risks=risks.filter(r=>r.owner===f.member);issues=issues.filter(i=>i.owner===f.member)}const milestones=db.milestones.filter(m=>ids.has(m.projectId)&&m.dueDate>=range.start&&m.dueDate<=range.end);return {projects,tasks,risks,issues,milestones,range}}
function reportEvmTable(projects){return `<div class="table-wrap"><table class="data-table report-table"><thead><tr><th>Proyek</th><th>BAC</th><th>PV</th><th>EV</th><th>AC</th><th>CV</th><th>SV</th><th>CPI</th><th>SPI</th></tr></thead><tbody>${projects.map(p=>{const e=getEvm(p);return `<tr><td><b>${esc(p.name)}</b></td><td>${fmtMoney(e.bac,true)}</td><td>${fmtMoney(e.pv,true)}</td><td>${fmtMoney(e.ev,true)}</td><td>${fmtMoney(e.ac,true)}</td><td>${fmtMoney(e.cv,true)}</td><td>${fmtMoney(e.sv,true)}</td><td>${e.cpi?.toFixed(2)||'—'}</td><td>${e.spi?.toFixed(2)||'—'}</td></tr>`}).join('')}</tbody></table></div>`}
function reportTypeBody(type,d){const {projects,tasks,risks,issues,milestones,range}=d;const allTasks=tasks;const h=projects.filter(p=>health(p)==='At risk'||health(p)==='Delayed').length;const completed=tasks.filter(t=>t.status==='Done').length;const openIssues=issues.filter(i=>!['Resolved','Closed'].includes(i.status));if(type==='executive')return `<div class="report-section"><h3>Executive summary</h3><p class="small muted">${projects.length} proyek terpilih. Rata-rata progres aktual ${projects.length?Math.round(projects.reduce((a,p)=>a+p.actualProgress,0)/projects.length):0}%. ${h} proyek memerlukan perhatian manajemen.</p><div class="report-note"><b>Rekomendasi:</b> Prioritaskan recovery plan untuk proyek dengan SPI di bawah 0,90; tetapkan owner dan target penyelesaian issue kritis; lakukan review kapasitas bila utilisasi tim melampaui 100%.</div></div><div class="report-section"><h3>Ringkasan status proyek</h3>${projectTableCompact(projects)}</div><div class="report-section"><h3>Risiko utama & tindak lanjut</h3>${reportRiskTable(risks.slice().sort((a,b)=>b.probability*b.impact-a.probability*a.impact).slice(0,5))}</div>`;if(type==='status')return `<div class="report-section"><h3>Status portofolio</h3>${projectTableCompact(projects)}</div><div class="report-section"><h3>EVM & forecast</h3>${reportEvmTable(projects)}</div>`;if(type==='weekly'||type==='monthly')return `<div class="report-section"><h3>Progress & deliverables (${type==='weekly'?'mingguan':'bulanan'})</h3><p class="tiny-text">${range.label} · ${completed} dari ${tasks.length} task tercatat selesai pada periode.</p>${reportTaskTable(tasks)}</div><div class="report-section"><h3>Health proyek</h3>${projectTableCompact(projects)}</div>`;if(type==='timeline')return `<div class="report-section"><h3>Timeline proyek</h3>${projects.map(p=>`<div class="card" style="margin-bottom:12px"><div class="toolbar"><b style="font-size:10px">${esc(p.name)}</b><span class="tiny-text">${fmtDate(p.startDate)} — ${fmtDate(p.dueDate)}</span></div>${ganttMarkup(p,projectTasks(p.id))}</div>`).join('')||'<div class="empty-state">Tidak ada data timeline.</div>'}</div>`;if(type==='sprint'){const ss=db.sprints.filter(s=>projects.some(p=>p.id===s.projectId)&&(ui.reportFilters.sprint==='all'||s.id===ui.reportFilters.sprint));return `<div class="report-section"><h3>Ringkasan sprint</h3><div class="table-wrap"><table class="data-table report-table"><thead><tr><th>Project / sprint</th><th>Sprint goal</th><th>Periode</th><th>Committed SP</th><th>Completed SP</th><th>Story done</th><th>Capacity</th></tr></thead><tbody>${ss.map(s=>{const m=sprintMetrics(s);return `<tr><td><b>${esc(getProject(s.projectId)?.name||'')} · ${esc(s.name)}</b></td><td>${esc(s.goal)}</td><td>${fmtDate(s.startDate)} – ${fmtDate(s.endDate)}</td><td>${m.total}</td><td>${m.done}</td><td>${m.completed}/${m.count}</td><td>${s.capacity} SP</td></tr>`}).join('')}</tbody></table></div></div>`}if(type==='budget')return `<div class="report-section"><h3>Budget & cost</h3>${reportEvmTable(projects)}<div class="report-note">Forecast EAC memakai formula BAC ÷ CPI. CPI di bawah 1,00 menunjukkan biaya aktual lebih tinggi dari nilai pekerjaan yang diperoleh.</div></div>`;if(type==='evm')return `<div class="report-section"><h3>Earned Value Management</h3><p class="tiny-text">PV = baseline budget × planned progress · EV = baseline budget × actual progress · CPI = EV ÷ AC · SPI = EV ÷ PV</p>${reportEvmTable(projects)}</div>`;if(type==='risks')return `<div class="report-section"><h3>Daftar risiko</h3>${reportRiskTable(risks)}</div><div class="report-section"><h3>Issue log</h3>${reportIssueTable(issues)}</div>`;if(type==='resources')return `<div class="report-section"><h3>Utilisasi sumber daya</h3>${resourceReportTable(db.members.filter(m=>m.active!==false&&(ui.reportFilters.member==='all'||m.name===ui.reportFilters.member)))}</div>`;return `<div class="report-section"><h3>Milestone & deliverables</h3>${reportMilestoneTable(milestones)}</div><div class="report-section"><h3>Requirement & approval</h3>${reportRequirementTable(projects)}</div>`}
function projectTableCompact(projects){return `<div class="table-wrap"><table class="data-table report-table"><thead><tr><th>Proyek / PM</th><th>Metode</th><th>Status</th><th>Aktual / rencana</th><th>Target</th><th>Budget</th></tr></thead><tbody>${projects.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="tiny-text">${esc(p.manager)}</div></td><td>${p.methodology==='agile'?'Agile':'Waterfall'}</td><td>${health(p)}</td><td>${Math.round(p.actualProgress)}% / ${Math.round(p.plannedProgress)}%</td><td>${fmtDate(p.dueDate)}</td><td>${fmtMoney(p.budget,true)}</td></tr>`).join('')||'<tr><td colspan="6">Tidak ada proyek sesuai filter.</td></tr>'}</tbody></table></div>`}
function reportTaskTable(tasks){return `<div class="table-wrap"><table class="data-table report-table"><thead><tr><th>Task / proyek</th><th>PIC</th><th>Fase / sprint</th><th>Status</th><th>Deadline</th><th>Estimasi / aktual</th></tr></thead><tbody>${tasks.map(t=>`<tr><td><b>${esc(t.title)}</b><div class="tiny-text">${esc(getProject(t.projectId)?.name||'')}</div></td><td>${esc(t.assignee||'—')}</td><td>${esc(t.phase||getSprintName(t.sprintId)||'Backlog')}</td><td>${esc(t.status)}</td><td>${fmtDate(t.dueDate)}</td><td>${Number(t.estimateHours)||0}h / ${Number(t.actualHours)||0}h</td></tr>`).join('')||'<tr><td colspan="6">Tidak ada pekerjaan pada periode ini.</td></tr>'}</tbody></table></div>`}
function getSprintName(id){return db.sprints.find(s=>s.id===id)?.name||''}
function reportRiskTable(risks){return `<div class="table-wrap"><table class="data-table report-table"><thead><tr><th>Proyek / risiko</th><th>P×I</th><th>Mitigasi</th><th>Penanggung jawab</th><th>Due</th><th>Status</th></tr></thead><tbody>${risks.map(r=>`<tr><td><b>${esc(getProject(r.projectId)?.name||'')}</b><div class="tiny-text">${esc(r.title)}</div></td><td>${r.probability}×${r.impact} = ${r.probability*r.impact}</td><td>${esc(r.mitigation)}</td><td>${esc(r.owner)}</td><td>${fmtDate(r.dueDate)}</td><td>${esc(r.status)}</td></tr>`).join('')||'<tr><td colspan="6">Tidak ada risiko pada periode ini.</td></tr>'}</tbody></table></div>`}
function reportIssueTable(items){return `<div class="table-wrap"><table class="data-table report-table"><thead><tr><th>Proyek / issue</th><th>Severity</th><th>Penanggung jawab</th><th>Due</th><th>Status</th></tr></thead><tbody>${items.map(i=>`<tr><td><b>${esc(getProject(i.projectId)?.name||'')}</b><div class="tiny-text">${esc(i.title)}</div></td><td>${esc(uiLabel(i.severity))}</td><td>${esc(i.owner)}</td><td>${fmtDate(i.dueDate)}</td><td>${esc(i.status)}</td></tr>`).join('')||'<tr><td colspan="5">Tidak ada issue pada periode ini.</td></tr>'}</tbody></table></div>`}
function reportMilestoneTable(items){return `<div class="table-wrap"><table class="data-table report-table"><thead><tr><th>Project / deliverable</th><th>Target date</th><th>Status</th></tr></thead><tbody>${items.map(m=>`<tr><td><b>${esc(getProject(m.projectId)?.name||'')}</b><div class="tiny-text">${esc(m.title)}</div></td><td>${fmtDate(m.dueDate)}</td><td>${esc(m.status)}</td></tr>`).join('')||'<tr><td colspan="3">Tidak ada milestone pada periode ini.</td></tr>'}</tbody></table></div>`}
function reportRequirementTable(projects){const list=db.requirements.filter(q=>projects.some(p=>p.id===q.projectId));return `<div class="table-wrap"><table class="data-table report-table"><thead><tr><th>Project / requirement</th><th>Penanggung jawab</th><th>Acceptance</th><th>Status</th><th>Approver</th></tr></thead><tbody>${list.map(q=>`<tr><td><b>${esc(getProject(q.projectId)?.name||'')}</b><div class="tiny-text">${esc(q.key)} · ${esc(q.title)}</div></td><td>${esc(q.owner)}</td><td>${esc(q.acceptance)}</td><td>${esc(q.status)}</td><td>${esc(q.approver||'—')}</td></tr>`).join('')||'<tr><td colspan="5">Belum ada requirement terdaftar.</td></tr>'}</tbody></table></div>`}
function resourceReportTable(members){return `<div class="table-wrap"><table class="data-table report-table"><thead><tr><th>Anggota</th><th>Role</th><th>Tugas aktif</th><th>Jam sisa</th><th>Kapasitas 2 minggu</th><th>Utilisasi</th></tr></thead><tbody>${members.map(m=>{const l=memberLoad(m);return `<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.role)}</td><td>${l.tasks.length}</td><td>${l.rem}h</td><td>${l.capacity}h</td><td>${l.pct}%</td></tr>`}).join('')}</tbody></table></div>`}
function renderReports(){if(!ui.reportType)ui.reportType='executive';const d=reportData(),projectIds=d.projects.length;const avg=projectIds?Math.round(d.projects.reduce((a,p)=>a+p.actualProgress,0)/projectIds):0;const budget=d.projects.reduce((a,p)=>a+p.budget,0),spent=d.projects.reduce((a,p)=>a+p.actualCost,0);const filter=ui.reportFilters;const sprints=db.sprints.filter(s=>filter.project==='all'||s.projectId===filter.project);const actions=`<button class="btn" data-action="export-csv">${icon('download',13)} CSV</button><button class="btn" data-action="export-xlsx">${icon('download',13)} Excel</button><button class="btn primary" data-action="export-pdf">${icon('print',13)} PDF / Cetak</button>`;return `${heading('Laporan & ekspor','Buat laporan stakeholder dengan filter proyek, periode, status, sprint, dan anggota.',actions)}<section class="report-banner"><div class="eyebrow">KAIROS · PORTFOLIO REPORT</div><h2>${REPORT_TYPES.find(x=>x[0]===ui.reportType)?.[1]||'Project report'}</h2><p>Reporting period: ${d.range.label} · Generated ${fmtDate(TODAY_ISO)}</p><div class="report-kpis"><div><strong>${projectIds}</strong><span>Projects</span></div><div><strong>${avg}%</strong><span>Avg. progress</span></div><div><strong>${fmtMoney(spent,true)}</strong><span>Biaya aktual</span></div><div><strong>${d.risks.filter(r=>r.status!=='Closed'&&r.probability*r.impact>=16).length}</strong><span>Critical risks</span></div></div></section><section class="card table-card" style="margin-bottom:14px"><div class="filter-bar no-print"><div class="report-controls"><label>Jenis laporan</label><select class="select" data-change="report-type">${REPORT_TYPES.map(([v,l])=>`<option value="${v}" ${ui.reportType===v?'selected':''}>${l}</option>`).join('')}</select><label>Proyek</label><select class="select" data-change="report-project"><option value="all">Semua proyek</option>${activeProjects().map(p=>`<option value="${p.id}" ${filter.project===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><label>Periode</label><select class="select" data-change="report-period"><option value="week" ${filter.period==='week'?'selected':''}>7 hari terakhir</option><option value="month" ${filter.period==='month'?'selected':''}>30 hari terakhir</option><option value="quarter" ${filter.period==='quarter'?'selected':''}>Kuartal berjalan</option><option value="year" ${filter.period==='year'?'selected':''}>Year to date</option><option value="all" ${filter.period==='all'?'selected':''}>Semua periode</option></select><label>Status</label><select class="select" data-change="report-status"><option value="all">Semua status</option>${['On track','At risk','Delayed','Completed'].map(s=>`<option ${filter.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="report-controls"><label>Anggota</label><select class="select" data-change="report-member"><option value="all">Semua anggota</option>${db.members.map(m=>`<option ${filter.member===m.name?'selected':''}>${esc(m.name)}</option>`).join('')}</select><label>Sprint</label><select class="select" data-change="report-sprint"><option value="all">Semua sprint</option>${sprints.map(s=>`<option value="${s.id}" ${filter.sprint===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><label>Fase</label><select class="select" data-change="report-phase"><option value="all">Semua fase</option>${PHASES.map(ph=>`<option value="${ph}" ${filter.phase===ph?'selected':''}>${ph}</option>`).join('')}</select></div></div><div class="report-content"><div class="report-summary"><div class="summary-tile"><span>Proyek terpilih</span><strong>${projectIds}</strong></div><div class="summary-tile"><span>On track</span><strong>${d.projects.filter(p=>health(p)==='On track').length}</strong></div><div class="summary-tile"><span>Task pada periode</span><strong>${d.tasks.length}</strong></div><div class="summary-tile"><span>Budget utilization</span><strong>${budget?Math.round(spent/budget*100):0}%</strong></div></div>${reportType function renderDatabaseSettings(){const last=cloud.lastSync?fmtDate(cloud.lastSync,{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Belum pernah';const memberPanel=cloud.ready?`<section class="card table-card" style="margin-top:14px"><div class="toolbar"><div><h3>Anggota & role workspace</h3><span class="tiny-text">Akses aplikasi mengikuti role yang diperiksa ulang oleh kebijakan RLS database.</span></div><span class="chip">${cloud.roster.length} anggota</span></div><div style="padding:12px 16px">${renderCloudMembers()}${cloud.role==='owner'?`<div class="cloud-info"><strong>Tambahkan pengguna yang sudah mendaftar</strong><p>Masukkan User ID Supabase milik pengguna. Untuk keamanan, Kairos tidak mengirim email undangan otomatis. Temukan UID di Dashboard Supabase → Authentication → Users.</p></div><form data-auth-form="member"><div class="form-grid"><div class="form-field"><label>User ID Supabase</label><input class="field-input" name="userId" required placeholder="UUID dari Authentication → Users"></div><div class="form-field"><label>Role awal</label><select class="select" name="role"><option value="project_manager">Project Manager · editor</option><option value="team_member">Anggota tim · editor</option><option value="stakeholder">Stakeholder · hanya baca</option><option value="owner">Owner</option></select></div><div class="form-field full"><button class="btn primary" type="submit" ${ui.authBusy?'disabled':''}>${icon('plus',12)} Tambahkan ke workspace</button></div></div></form>`:'<div class="tiny-text" style="margin-top:10px">Hubungi owner untuk mengundang anggota atau mengubah role.</div>'}</div></section>`:'';const conflict=cloud.conflictDraft?`<div class="cloud-conflict"><strong>Ada draft lokal akibat edit bersamaan</strong><p>Data cloud terbaru sudah dimuat. Draft perubahan yang gagal disimpan masih ada di memori browser ini. Pilih dengan sadar apakah akan mengirim seluruh draft (dapat menimpa edit terbaru) atau membuangnya.</p><div class="toolbar-right"><button class="btn primary tiny" data-action="apply-conflict-draft">Gunakan draft lokal</button><button class="btn danger tiny" data-action="discard-conflict-draft">Buang draft</button></div></div>`:'';const cloudState=cloud.ready?`<div class="cloud-info ${cloud.status==='offline'||cloud.status==='conflict'?'cloud-warning':''}"><strong>${cloudBadge()} · ${esc(cloud.workspace?.name||'Workspace')}</strong><p>Akun: ${esc(cloud.session?.user?.email||'')} · Role: <b>${esc(currentRoleName())}</b><br>Workspace ID: <code>${esc(cloud.workspaceId||'')}</code><br>Versi data: ${cloud.version} · Sinkron terakhir: ${last}</p>${cloud.role==='stakeholder'?'<p><b>Mode baca saja.</b> Anda dapat membuka dashboard, melihat data, dan mengekspor laporan; perubahan data dinonaktifkan.</p>':''}</div>${conflict}<div class="toolbar-right" style="margin:12px 0"><button class="btn" data-action="sync-now">${icon('refresh',12)} Sinkronkan sekarang</button><button class="btn" data-action="switch-local-mode">Gunakan salinan lokal di browser ini</button></div>${memberPanel}`:`<div class="cloud-info"><strong>${cloud.useLocal?'Mode lokal aktif':'Cloud belum terhubung'}</strong><p>Mode lokal menyimpan data hanya di browser/perangkat ini. Untuk berbagi dengan tim, isi URL dan anon/public key project Supabase, simpan konfigurasi, lalu masuk atau buat akun.</p></div>${cloudConfigured()?'<button class="btn primary" style="margin-bottom:12px" data-action="connect-cloud">Masuk / gunakan workspace cloud</button>':''}`;return `<div class="section-title"><div><h2>Database bersama & akses</h2><p>Frontend statis tetap berada di GitHub Pages; autentikasi dan penyimpanan tim berada di Supabase.</p></div>${cloud.ready?cloudBadge():''}</div>${cloud.message?`<div class="auth-alert ${cloud.status==='error'?'error':''}">${esc(cloud.message)}</div>`:''}${cloudState}<div class="toolbar-right" style="margin:10px 0"><button class="btn tiny" data-action="export-backup-json">${icon('download',12)} Unduh snapshot data JSON</button></div><div class="cloud-info"><strong>Konfigurasi Supabase</strong><p>Ambil Project URL dan anon/public key dari Dashboard Supabase. Key publik dapat berada di frontend karena keamanan tabel ditentukan oleh Row Level Security (RLS). <b>Jangan pernah masukkan service_role/secret key.</b></p></div><form data-auth-form="config"><div class="form-grid"><div class="form-field full"><label>Project URL Supabase</label><input class="field-input" type="url" name="url" value="${esc(cloud.config.url)}" required placeholder="https://xxxx.supabase.co"></div><div class="form-field full"><label>Anon / public key</label><textarea class="field-textarea" name="anonKey" rows="3" required placeholder="sb_publishable_… atau anon JWT key">${esc(cloud.config.anonKey)}</textarea><small>Key ini disimpan di localStorage perangkat ini. Jangan tempelkan service_role key.</small></div><div class="form-field full"><button class="btn primary" type="submit" ${ui.authBusy?'disabled':''}>${icon('check',12)} Simpan konfigurasi & hubungkan</button></div></div></form><div class="modal-helper" style="margin-top:14px"><b>Penyimpanan lokal dan cloud berbeda.</b> Menyimpan konfigurasi tidak memigrasikan otomatis data demo/localStorage ke cloud. Saat membuat workspace baru, pilih centang data demo hanya bila memang ingin menyalin data contoh ke workspace baru. Untuk backup, ekspor laporan XLSX/CSV dan backup database Supabase secara terpisah.</div>`}
function renderSettings(){const tabs=[['database','Database & akses'],['workflow','Workflow'],['calendar','Kalender kerja'],['roles','Role & permission'],['templates','Template'],['archive','Arsip proyek']];let content='';if(ui.settingsTab==='workflow'){const cols=db.settings.agileColumns||DEFAULT_AGILE_COLUMNS;content=`<div class="section-title"><div><h2>Kolom Scrum board</h2><p>Atur status yang dapat dipakai untuk drag-and-drop pada workspace Agile.</p></div><button class="btn primary tiny" data-action="add-workflow-column">${icon('plus',12)} Tambah kolom</button></div>${cols.map((c,i)=>`<div class="setting-row"><div style="display:flex;align-items:center;gap:8px"><span class="lane-dot ${c==='Done'?'done':c==='In Progress'?'progress':c==='Testing'?'testing':''}"></span><input class="field-input" style="max-width:170px;padding:7px 8px" value="${esc(c)}" data-change="workflow-name" data-index="${i}"></div><div style="display:flex;gap:4px"><button class="row-action" data-action="move-column-up" data-index="${i}" ${i===0?'disabled':''}>↑</button><button class="row-action" data-action="move-column-down" data-index="${i}" ${i===cols.length-1?'disabled':''}>↓</button><button class="row-action" data-action="remove-column" data-index="${i}" ${cols.length<=2?'disabled':''}>${icon('trash',12)}</button></div></div>`).join('')}<div class="modal-helper" style="margin-top:12px">Task yang statusnya tidak lagi digunakan akan tetap tersimpan. Kolom status dapat diatur ulang sesuai workflow tim.</div>`}else if(ui.settingsTab==='calendar'){const days=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];content=`<div class="section-title"><div><h2>Kalender kerja</h2><p>Pengaturan hari kerja untuk perencanaan kapasitas dan jadwal.</p></div></div><div class="setting-row"><div><strong>Hari kerja proyek</strong><small>Pilih hari yang dihitung sebagai hari kerja.</small></div><div class="day-checks">${days.map((d,i)=>`<label class="day-check"><input type="checkbox" data-change="workday" value="${i} ditentukan oleh role anggota (owner, Project Manager, anggota tim, stakeholder) dan kebijakan RLS Supabase.</div>`}else if(ui.settingsTab==='templates'){content=`<div class="section-title"><div><h2>Project templates</h2><p>Mulai proyek dengan baseline aktivitas sesuai metodologi.</p></div></div><div class="page-grid-2"><div class="info-block"><span class="method-tag">WATERFALL</span><h3 style="font-size:11px;margin:9px 0 4px">Project delivery plan</h3><p>Charter, fase 7 tahap, WBS, requirements, approval, milestone, risk register, dan sign-off.</p><button class="btn primary tiny" style="margin-top:10px" data-action="new-project" data-method="waterfall" data-template="waterfall">Gunakan template ${icon('arrow',11)}</button></div><div class="info-block"><span class="method-tag agile">AGILE</span><h3 style="font-size:11px;margin:9px 0 4px">Product delivery team</h3><p>Backlog awal, Sprint 1, Scrum board, kapasitas, stand-up, retrospective, dan release plan.</p><button class="btn primary tiny" style="margin-top:10px" data-action="new-project" data-method="agile" data-template="agile">Gunakan template ${icon('arrow',11)}</button></div></div><div class="modal-helper" style="margin-top:12px">Project template membuat struktur awal yang dapat disesuaikan. Template tidak mengunci workflow tim.</div>`}else if(ui.settingsTab==='database'){content=renderDatabaseSettings()}else{const archived=db.projects.filter(p=>p.archived);content=`<div class="section-title"><div><h2>Proyek diarsipkan</h2><p>Proyek arsip tidak ditampilkan pada dashboard aktif.</p></div></div>${archived.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Proyek</th><th>Metode</th><th>Target</th><th>Actions</th></tr></thead><tbody>${archived.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="tiny-text">${esc(p.code)}</div></td><td>${methodologyTag(p.methodology)}</td><td>${fmtDate(p.dueDate)}</td><td><button class="btn tiny" data-action="restore-project" data-id="${p.id}">Pulihkan</button><button class="btn tiny danger" data-action="delete-project" data-id="${p.id}">${icon('trash',11)} Hapus permanen</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><strong>Arsip masih kosong</strong><span>Arsipkan proyek selesai dari halaman detail.</span></div>'}`}return `${heading('Pengaturan','Atur alur kerja, hari kerja, akses workspace, template, dan siklus proyek.',`<span class="chip">Perubahan tersimpan otomatis</span><button class="btn tiny" data-action="reset-demo" ${cloud.ready?'disabled title="Hanya tersedia pada mode lokal"':''}>${icon('refresh',12)} Pulihkan demo lokal</button>`)}<div class="settings-layout"><nav class="card settings-nav">${tabs.map(([k,l])=>`<button class="${ui.settingsTab===k?'active':''}" data-action="settings-tab" data-tab="${k}">${icon(k==='workflow'?'layers':k==='calendar'?'calendar':k==='roles'?'lock':k==='archive'?'file':'spark',13)}${l}</button>`).join('')}</nav><section class="card settings-content">${content}</section></div>`}
function openModal(type,data={}){ui.modal={type,data};render()}

function fieldText(label,name,value='',type='text',required=false,placeholder=''){return `<div class="form-field"><label>${label}${required?' <span>*</span>':''}</label><input class="field-input" type="${type}" name="${name}" value="${esc(value)}" ${required?'required':''} ${placeholder?`placeholder="${esc(placeholder)}"`:''}></div>`}
function fieldSelect(label,name,value,options,required=false){return `<div class="form-field"><label>${label}${required?' <span>*</span>':''}</label><select class="select" name="${name}" ${required?'required':''}>${options.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(uiLabel(l))}</option>`}).join('')}</select></div>`}

ncies" multiple size="3">${taskChoices.map(x=>`<option value="${x.id}" ${(t?.dependencies||[]).includes(x.id)?'selected':''}>${esc(x.title)}</option>`).join('')}</select><small>Tugas ini dapat dimulai setelah dependensi yang dipilih selesai.</small></div>${fieldArea('Deskripsi / acceptance criteria','description',t?.description||'')}<div class="form-field full"><label class="check-row"><input type="checkbox" name="critical" value="true" ${t?.critical?'checked':''}> Tandai sebagai critical path (Waterfall)</label></div>`}
else if(type==='risk'){const r=data.id?db.risks.find(x=>x.id===data.id):null;title=r?'Edit risiko':'Tambah risk register';body=`<input type="hidden" name="id" value="${esc(r?.id||'')}">${fieldSelect('Proyek','projectId',r?.projectId||data.projectId||ui.currentProjectId,activeProjects().map(p=>[p.id,p.name]),true)}${fieldText('Judul risiko','title',r?.title||'','text',true)}${fieldSelect('Probabilitas (1–5)','probability',r?.probability||3,[1,2,3,4,5])}${fieldSelect('Dampak (1–5)','impact',r?.impact||3,[1,2,3,4,5])}${fieldSelect('Penanggung jawab','owner',r?.owner||currentUserName(),db.members.map(m=>m.name))}${fieldSelect('Status','status',r?.status||'Open',['Open','Mitigating','Closed'])}${fieldText('Review / due date','dueDate',r?.dueDate||dateOffset(TODAY_ISO,14),'date')}${fieldArea('Mitigation plan','mitigation',r?.mitigation||'')}`}
