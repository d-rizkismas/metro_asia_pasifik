async function enterWorkspace(workspaceId,role){cloud.workspaceId=workspaceId;persistWorkspaceChoice();cloud.role=role;const workspaces=await dbRequest(`/rest/v1/workspaces?id=eq.${encodeURIComponent(workspaceId)}&select=id,name,owner_id`);cloud.workspace=workspaces?.[0]||{id:workspaceId,name:'Shared workspace'};let states=await dbRequest(`/rest/v1/workspace_state?workspace_id=eq.${encodeURIComponent(workspaceId)}&select=payload,version,updated_at`);if(!states?.length&&role==='owner'){const payload=db;const inserted=await dbRequest('/rest/v1/workspace_state',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({workspace_id:workspaceId,payload,version:1,updated_by:cloud.session.user.id})});states=inserted}if(!states?.length)throw new Error('Data workspace belum dibuat. Minta owner untuk menyiapkan workspace.');cloud.version=Number(states[0].version)||1;db=hydrateWorkspacePayload(states[0].payload);cloud.basePayload=JSON.parse(JSON.stringify(db));cloud.pending=false;cloud.conflictDraft=pendingCloudDraft(workspaceId)?.payload||null;cloud.localRevision=0;try{localStorage.setItem('kairos.pm.v1',JSON.stringify(db))}catch{}cloud.ready=true;cloud.initializing=false;cloud.useLocal=false;persistLocalMode();cloud.status=cloud.conflictDraft?'conflict':'synced';cloud.lastSync=new Date().toISOString();cloud.message='';await loadCloudMemberships().catch(()=>{});await loadWorkspaceRoster().catch(()=>{});startCloudPolling();render();if(cloud.conflictDraft)toast('Draft lokal yang belum tersinkron ditemukan. Periksa di Pengaturan → Database & akses.',true)}

async function createCloudWorkspace(name,includeDemo=false){const clean=String(name||'').trim();if(clean.length<2)throw new Error('Nama workspace minimal 2 karakter.');const created=await dbRequest('/rest/v1/workspaces?select=id,name,owner_id',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({name:clean,owner_id:cloud.session.user.id})});const workspace=created?.[0];if(!workspace?.id)throw new Error('Workspace tidak berhasil dibuat.');await dbRequest('/rest/v1/workspace_members',{method:'POST',body:JSON.stringify({workspace_id:workspace.id,user_id:cloud.session.user.id,role:'owner'})});db=includeDemo?seedDatabase():localEmptyDatabase();if(includeDemo&&!db.members.some(m=>m.email&&m.email.toLowerCase()===String(cloud.session.user.email||'').toLowerCase()))db.members.unshift({id:uid('m'),name:currentUserName(),role:'Project Manager',email:cloud.session.user.email||'',capacity:40,skills:'Workspace owner',active:true});await dbRequest('/rest/v1/workspace_state',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({workspace_id:workspace.id,payload:db,version:1,updated_by:cloud.session.user.id})});cloud.workspaceId=workspace.id;persistWorkspaceChoice();cloud.workspace=workspace;cloud.role='owner';cloud.version=1;cloud.basePayload=JSON.parse(JSON.stringify(db));cloud.pending=false;cloud.conflictDraft=null;cloud.localRevision=0;cloud.ready=true;cloud.initializing=false;cloud.membershipNeeded=false;cloud.useLocal=false;persistLocalMode();cloud.status='synced';cloud.lastSync=new Date().toISOString();await loadCloudMemberships().catch(()=>{});await loadWorkspaceRoster().catch(()=>{});startCloudPolling();try{localStorage.setItem('kairos.pm.v1',JSON.stringify(db))}catch{}render();toast('Workspace bersama berhasil dibuat')}
async function pullCloudState(showToast=true){if(!cloud.ready||!cloud.workspaceId)return;try{const rows=await dbRequest(`/rest/v1/workspace_state?workspace_id=eq.${encodeURIComponent(cloud.workspaceId)}&select=payload,version,updated_at`);if(!rows?.length)return;const remoteVersion=Number(rows[0].version)||0;if(remoteVersion>cloud.version&&!cloud.pending){db=hydrateWorkspacePayload(rows[0].payload);cloud.version=remoteVersion;cloud.basePayload=JSON.parse(JSON.stringify(db));cloud.lastSync=new Date().toISOString();cloud.status=cloud.conflictDraft?'conflict':'synced';try{localStorage.setItem('kairos.pm.v1',JSON.stringify(db))}catch{}render();if(showToast)toast('Perubahan anggota tim disinkronkan')}else{if(!cloud.pending&&!cloud.conflictDraft&&cloud.status!=='conflict')cloud.status='synced';cloud.lastSync=new Date().toISOString()}}catch(err){console.warn('Cloud refresh:',err.message);cloud.status='offline';if(showToast)toast(`Sinkronisasi gagal: ${err.message}`,true)}}
async function pushCloudState(){if(!cloud.ready||!cloud.pending||cloud.role==='stakeholder'||cloud.saving)return;cloud.saving=true;cloud.resaveAfterCurrent=false;cloud.status='saving';const expected=cloud.version,revision=cloud.localRevision,payload=JSON.parse(JSON.stringify(db));let retryLatest=false;try{const rows=await dbRequest(`/rest/v1/workspace_state?workspace_id=eq.${encodeURIComponent(cloud.workspaceId)}&version=eq.${expected}`,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({payload,version:expected+1,updated_by:cloud.session.user.id,updated_at:new Date().toISOString()})});if(!rows?.length){cloud.conflictDraft=JSON.parse(JSON.stringify(db));persistPendingCloudDraft(cloud.conflictDraft);cloud.pending=false;cloud.status='conflict';await pullCloudState(false);cloud.status='conflict';render();toast('Ada perubahan bersamaan. Data terbaru dimuat; draft lokal Anda disimpan untuk dipilih dari Settings → Database & akses.',true);return}cloud.version=Number(rows[0].version)||expected+1;cloud.basePayload=payload;cloud.lastSync=new Date().toISOString();if(cloud.localRevision===revision){cloud.pending=false;cloud.conflictDraft=null;clearPendingCloudDraft(cloud.workspaceId);cloud.status='synced'}else{cloud.pending=true;persistPendingCloudDraft(db);cloud.status='saving';retryLatest=true}}catch(err){console.error(err);cloud.status='offline';cloud.resaveAfterCurrent=false;toast(`Belum tersinkron: ${err.message}. Perubahan lokal masih tersimpan; coba sinkronkan lagi.`,true)}finally{cloud.saving=false;if(retryLatest&&cloud.pending){clearTimeout(cloud.saveTimer);cloud.saveTimer=setTimeout(pushCloudState,650)}}}

function uid(prefix='id'){return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtMoney(value,short=false){const n=Number(value)||0;if(short){if(Math.abs(n)>=1e9)return `Rp ${(n/1e9).toFixed(1).replace('.',',')} M`;if(Math.abs(n)>=1e6)return `Rp ${(n/1e6).toFixed(0)} jt`;return `Rp ${new Intl.NumberFormat('id-ID').format(n)}`}return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n)}
function fmtNum(n,d=0){return new Intl.NumberFormat('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d}).format(Number(n)||0)}
function fmtDate(s,opts={day:'numeric',month:'short',year:'numeric'}){if(!s)return '—';const d=new Date(`${s.slice(0,10)}T12:00:00`);if(Number.isNaN(d.getTime()))return s;return new Intl.DateTimeFormat('id-ID',opts).format(d)}
function dateOffset(s,days){const d=new Date(`${s}T12:00:00`);d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function activeProjects(){return db.projects.filter(p=>!p.archived)}
function projectTasks(pid,includeBacklog=true){return db.tasks.filter(t=>t.projectId===pid&&(includeBacklog||t.includeProgress!==false))}
function getEvm(p){const bac=Number(p.baselineBudget)||Number(p.budget)||0;const pv=bac*(Number(p.plannedProgress)||0)/100;const ev=bac*(Number(p.actualProgress)||0)/100;const ac=Number(p.actualCost)||0;const cpi=ac?ev/ac:null;const spi=pv?ev/pv:null;const cv=ev-ac;const sv=ev-pv;const eac=cpi?bac/cpi:bac;return {bac,pv,ev,ac,cpi,spi,cv,sv,eac}}
function health(p){if(p.status==='Completed'||p.actualProgress>=100)return 'Completed';const d=(Number(p.actualProgress)||0)-(Number(p.plannedProgress)||0),e=getEvm(p);if(d<=-10||(e.spi!==null&&e.spi<.8))return 'Delayed';if(d<=-4||(e.cpi!==null&&e.cpi<.9)||(e.spi!==null&&e.spi<.9))return 'At risk';return p.status==='On Hold'?'At risk':'On track'}

function methodologyTag(method){return `<span class="method-tag ${method==='agile'?'agile':''}">${method==='agile'?'Agile':'Waterfall'}</span>`}
function progressBar(value,planned=null,mint=false){const v=Math.max(0,Math.min(100,Number(value)||0));return `<div class="progress-cell"><div class="progress-meta"><span>Aktual${planned!==null?` <span style="color:#c3cad5">/ rencana</span>`:''}</span><b>${Math.round(v)}%${planned!==null?` / ${Math.round(planned)}%`:''}</b></div><div class="progress-track ${mint?'mint':''}"><span style="width:${v}%"></span></div></div>`}
function initials(name=''){return name.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'—'}
function avatar(name,size=''){const m=getMember(name);const index=m?Math.max(0,db.members.findIndex(x=>x.id===m.id)):0;return `<span class="avatar ${size} ${AVATAR_COLORS[index%AVATAR_COLORS.length]}" title="${esc(name)}">${esc(initials(name))}</span>`}

8-13.8a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',check:'<path d="m5 12 4 4L19 6"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/>',download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',flag:'<path d="M5 21V5m0 0c5-4 9 4 14 0v11c-5 4-9-4-14 0"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',close:'<path d="m18 6-12 12M6 6l12 12"/>',spark:'<path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z"/><path d="m19 14 .9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14Z"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',money:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h.01M17 15h.01M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 2M4 16l2 2a7 7 0 0 0 12.4-3"/>',layers:'<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/>',checklist:'<path d="m4 6 2 2 4-4M12 7h8M4 15l2 2 4-4M12 16h8"/>',lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',print:'<path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/>',pin:'<path d="M12 22s8-4.5 8-12a8 8 0 1 0-16 0c0 7.5 8 12 8 12Z"/><circle cx="12" cy="10" r="2.5"/>',sparkline:'<path d="m3 16 5-5 4 3 8-8"/>'};return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p[name]||p.grid}</svg>`}
function audit(text){db.audit.unshift({id:uid('a'),text,user:currentUserName(),date:new Date().toISOString()});db.audit=db.audit.slice(0,40)}
function toast(message,error=false){const root=document.getElementById('toastRoot');const el=document.createElement('div');el.className=`toast ${error?'error':''}`;el.innerHTML=`${icon(error?'warning':'check',15)}<span>${esc(message)}</span>`;root.appendChild(el);setTimeout(()=>el.remove(),3200)}
function setView(view){ui.view=view;ui.notificationsOpen=false;ui.sidebarOpen=false;render();window.scrollTo(0,0)}
function openProject(id,tab='overview'){ui.currentProjectId=id;ui.detailTab=tab;ui.view='project-detail';ui.sidebarOpen=false;render();window.scrollTo(0,0)}
function updateProgressFromTasks(pid){const p=getProject(pid);if(!p)return;const relevant=db.tasks.filter(t=>t.projectId===pid&&t.includeProgress!==false);p.actualProgress=relevant.length?Math.round(relevant.reduce((a,t)=>a+(Number(t.progress)||0),0)/relevant.length):0;}
function setTaskStatus(task,status){if(!canEditData()){toast('Role stakeholder hanya memiliki akses baca.',true);return}const t=getTask(task);if(!t)return;t.status=status;t.progress=status==='Done'?100:status==='Testing'?85:status==='Code Review'?72:status==='In Progress'?Math.max(35,Math.min(75,Number(t.progress)||50)):status==='Blocked'?Math.max(10,Math.min(50,Number(t.progress)||20)):0;t.updatedAt=new Date().toISOString();updateProgressFromTasks(t.projectId);audit(`Status tugas "${t.title}" diubah menjadi ${status}`);save();render();toast('Status tugas diperbarui')}
function projectColor(index){return ['','green','blue','orange'][index%4]}
function projectMark(p){const idx=Math.max(0,db.projects.findIndex(x=>x.id===p.id));return `<span class="project-mark ${projectColor(idx)}">${esc((p.code||p.name).slice(0,2).toUpperCase())}</span>`}
function activeProjectCount(method){return activeProjects().filter(p=>!method||p.methodology===method).length}
function navButton(view,label,iconName,count=''){const active=ui.view===view||(ui.view==='project-detail'&&view==='projects');return `<button class="nav-item ${active?'active':''}" data-view="${view}">${icon(iconName,17)}<span>${label}</span>${count?`<span class="nav-count">${count}</span>`:''}</button>`}
function persistLocalMode(){try{localStorage.setItem('kairos.supabase.localMode.v1',String(cloud.useLocal))}catch{}}
function canEditData(){return !(cloud.ready&&cloud.role==='stakeholder')}
function cloudStatusText(){if(!cloud.ready)return cloud.useLocal?'Mode lokal':cloudConfigured()?'Belum masuk':'Lokal';return ({synced:'Tersinkron',saving:'Menyimpan…',offline:'Offline',conflict:'Konflik',error:'Perlu perhatian'})[cloud.status]||'Tersinkron'}
function cloudBadge(){const cls=cloud.ready?(cloud.status||'synced'):'local';return `<span class="sync-badge ${esc(cls)}" title="${cloud.lastSync?`Sinkron terakhir ${fmtDate(cloud.lastSync,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}`:'Data tersimpan di browser ini'}">${esc(cloudStatusText())}</span>`}
function workspaceInitials(){const name=cloud.workspace?.name||'Kairos';return name.trim().split(' ').filter(Boolean).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'K'}
function canEditAction(action){return action.startsWith('new-')||action.startsWith('edit-')||action.startsWith('delete-')||['approve-requirement','signoff-document','archive-project','restore-project','add-to-sprint','move-column-up','move-column-down','remove-column','add-workflow-column','add-role','reset-demo','apply-conflict-draft','discard-conflict-draft','cloud-remove-member'].includes(action)}
function localMode(){stopCloudPolling();cloud.useLocal=true;persistLocalMode();cloud.ready=false;cloud.initializing=false;cloud.status='local';cloud.message='';ui.authMessage='';ui.authBusy=false;render()}
async function signOutAndReturn(){try{if(cloud.session?.access_token&&cloud.config.url){await fetch(`${cloud.config.url}/auth/v1/logout`,{method:'POST',headers:{apikey:cloud.config.anonKey,Authorization:`Bearer ${cloud.session.access_token}`}})}}catch(e){console.warn('Logout Supabase:',e.message)}signOutCloud()}
function persistWorkspaceChoice(){try{if(cloud.workspaceId)localStorage.setItem('kairos.supabase.workspace.v1',cloud.workspaceId);else localStorage.removeItem('kairos.supabase.workspace.v1')}catch{}}
function validateSupabaseConfig(url,key){let parsed;try{parsed=new URL(url)}catch{throw new Error('URL Supabase tidak valid. Salin Project URL dari Settings → API.')}if(!['https:','http:'].includes(parsed.protocol))throw new Error('URL harus menggunakan HTTPS (HTTP hanya untuk localhost).');if(parsed.protocol==='http:'&&!['localhost','127.0.0.1'].includes(parsed.hostname))throw new Error('Untuk koneksi non-lokal gunakan HTTPS.');if(!key||key.length<20)throw new Error('Anon/public key terlihat terlalu pendek. Salin key dari Supabase Settings → API Keys.');if(/^sb_secret_/i.test(key)||/service_role/i.test(key))throw new Error('Jangan gunakan service_role/secret key di browser. Gunakan anon/public key.');try{const part=key.split('.')[1];if(part){const payload=JSON.parse(atob(part.replace(/-/g,'+').replace(/_/g,'/')));if(payload.role==='service_role')throw new Error('service_role key tidak boleh digunakan di browser. Gunakan anon/public key.')}}catch(e){if(e.message.includes('service_role'))throw e}while(url.endsWith('/'))url=url.slice(0,-1);return {url,anonKey:key}}
async function saveCloudConfiguration(fd){const config=validateSupabaseConfig(String(fd.get('url')||'').trim(),String(fd.get('anonKey')||'').trim());const changed=config.url!==cloud.config.url||config.anonKey!==cloud.config.anonKey;if(changed){stopCloudPolling();cloud.session=null;persistCloudSession();cloud.workspaceId=null;persistWorkspaceChoice();cloud.workspace=null;cloud.members=[];cloud.roster=[];cloud.workspaces=[];cloud.version=0}cloud.config=config;persistCloudConfig();cloud.ready=false;cloud.useLocal=false;persistLocalMode();cloud.message='';ui.authMessage='';render();if(cloud.session)await continueCloudLogin(true)}
async function switchCloudWorkspace(workspaceId){const member=cloud.members.find(x=>x.workspace_id===workspaceId);if(!member)throw new Error('Workspace tersebut tidak tersedia untuk akun ini.');ui.workspaceMenuOpen=false;cloud.pending=false;cloud.conflictDraft=null;stopCloudPolling();await enterWorkspace(member.workspace_id,member.role)}
function renderCloudMembers(){if(!cloud.ready)return '';if(!cloud.roster.length)return '<div class="tiny-text">Daftar anggota belum dapat dimuat.</div>';return `<div class="cloud-member-list">${cloud.roster.map(m=>{const isMe=m.user_id===cloud.session?.user?.id;return `<div class="cloud-member-row"><span class="cloud-member-id" title="${esc(m.user_id)}">${esc(m.user_id)}${isMe?' · Anda':''}</span><select class="select" data-change="cloud-member-role" data-user-id="${esc(m.user_id)}" ${cloud.role!=='owner'||isMe?'disabled':''}>${[['owner','Owner'],['project_manager','Project Manager'],['team_member','Anggota tim'],['stakeholder','Stakeholder · baca saja']].map(([v,l])=>`<option value="${v}" ${m.role===v?'selected':''}>${l}</option>`).join('')}</select>${cloud.role==='owner'&&!isMe?`<button class="row-action" data-action="cloud-remove-member" data-id="${esc(m.user_id)}" title="Keluarkan anggota">${icon('trash',13)}</button>`:'<span class="tiny-text">'+(isMe?'Akun Anda':'')+'</span>'}</div>`}).join('')}</div>`}
async function handleCloudFormSubmit(event){const form=event.target.closest('form[data-auth-form]');if(!form)return;event.preventDefault();event.stopImmediatePropagation();const type=form.dataset.authForm,fd=new FormData(form);ui.authBusy=true;cloud.message='';ui.authMessage='';render();try{if(type==='config'){await saveCloudConfiguration(fd);ui.authBusy=false;return}if(type==='login'){const data=await authRequest('/auth/v1/token?grant_type=password',{email:String(fd.get('email')||'').trim(),password:String(fd.get('password')||'')});setCloudSession(data);ui.authBusy=false;await continueCloudLogin(true);return}if(type==='signup'){const data=await authRequest('/auth/v1/signup',{email:String(fd.get('email')||'').trim(),password:String(fd.get('password')||''),data:{full_name:String(fd.get('name')||'').trim()}});if(data.access_token){setCloudSession(data);ui.authBusy=false;await continueCloudLogin(true)}else{ui.authBusy=false;ui.authMessage='Akun berhasil dibuat. Periksa email untuk konfirmasi, lalu kembali dan masuk.';cloud.message='';render()}return}if(type==='workspace'){if(!cloud.session)throw new Error('Sesi akun tidak ditemukan. Silakan masuk kembali.');await createCloudWorkspace(String(fd.get('name')||''),fd.get('includeDemo')==='true');ui.authBusy=false;return}if(type==='member'){if(!cloud.ready||cloud.role!=='owner')throw new Error('Hanya owner workspace yang dapat menambah anggota.');await addCloudMember(String(fd.get('userId')||''),String(fd.get('role')||'team_member'));ui.authBusy=false;return}}catch(err){console.error(err);ui.authBusy=false;cloud.message=err.message||'Permintaan gagal. Periksa koneksi dan konfigurasi.';cloud.status='error';render()}}
function renderAuthScreen(){const mode=cloud.membershipNeeded?'workspace':ui.authMode;const alertText=cloud.message||ui.authMessage;const title=mode==='workspace'?'Buat workspace bersama':mode==='signup'?'Buat akun Kairos':'Masuk ke Kairos';const intro=mode==='workspace'?'Akun Anda sudah siap. Buat workspace tim bersama atau minta owner menambahkan User ID Anda.':mode==='signup'?'Buat akun untuk mengakses proyek bersama dari perangkat mana pun.':'Masuk untuk menyinkronkan proyek dengan workspace tim Anda.';let form='';if(cloud.initializing)form='<div class="auth-loading">Menghubungkan ke workspace…</div>';else if(mode==='workspace')form=`<form data-auth-form="workspace"><div class="auth-fields"><div><label>Nama workspace</label><input name="name" required minlength="2" value="Northstar Workspace" placeholder="Contoh: PMO Nusantara"></div><label class="check-row"><input type="checkbox" name="includeDemo" value="true"> Isi dengan data demo untuk mencoba</label></div><button class="auth-submit" type="submit" ${ui.authBusy?'disabled':''}>Buat workspace & mulai</button></form><div class="auth-foot">Jika Anda seharusnya bergabung ke workspace yang sudah ada, minta owner memasukkan User ID Supabase Anda di Settings → Database & akses.</div>`;else form=`<div class="auth-tabs"><button class="${mode==='login'?'active':''}" data-action="auth-mode" data-mode="login">Masuk</button><button class="${mode==='signup'?'active':''}" data-action="auth-mode" data-mode="signup">Buat akun</button></div><form data-auth-form="${mode}"><div class="auth-fields">${mode==='signup'?'<div><label>Nama lengkap</label><input name="name" required autocomplete="name" placeholder="Nama Anda"></div>':''}<div><label>Email</label><input name="email" type="email" required autocomplete="email" placeholder="nama@perusahaan.com"></div><div><label>Password</label><input name="password" type="password" minlength="8" required autocomplete="${mode==='login'?'current-password':'new-password'}" placeholder="Minimal 8 karakter"></div></div><button class="auth-submit" type="submit" ${ui.authBusy?'disabled':''}>${ui.authBusy?'Memproses…':mode==='signup'?'Buat akun':'Masuk'}</button></form><div class="auth-divider">atau</div><button class="auth-local" data-action="use-local-mode">Coba mode lokal / demo di browser ini</button><button class="link-button" style="margin-top:10px" data-action="clear-cloud-config">Ganti konfigurasi database</button><div class="auth-foot">Aplikasi ini memakai Supabase Auth dan database PostgreSQL. Pastikan hanya menggunakan <b>anon/public key</b> pada aplikasi web—jangan pernah menempelkan service_role key di HTML.</div>`;return `<div class="auth-screen"><div class="auth-card"><aside class="auth-aside"><div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18V6l14 12V6"/><path d="M5 12h14" opacity=".45"/></svg></div><div class="brand-name">KAIROS<span class="brand-sub">MANAJEMEN PROYEK</span></div></div><h1>Proyek bergerak lebih baik, bersama.</h1><p>Satu ruang kerja untuk mengelola portfolio, pengelolaan Waterfall dan Agile, risiko, kapasitas tim, dan laporan.</p><div class="auth-points"><div class="auth-point"><span>${icon('folder',13)}</span>Portofolio proyek bersama</div><div class="auth-point"><span>${icon('agile',13)}</span>Waterfall & Agile</div><div class="auth-point"><span>${icon('chart',13)}</span>Dashboard & EVM</div><div class="auth-point"><span>${icon('users',13)}</span>Role & kapasitas tim</div></div><div class="auth-note">Data cloud berada di project Supabase organisasi Anda.</div></aside><section class="auth-main"><div class="eyebrow">RUANG KERJA TIM BERSAMA</div><h2>${title}</h2><p>${intro}</p>${alertText?`<div class="auth-alert ${cloud.status==='error'?'error':''}">${esc(alertText)}</div>`:''}${form}</section></div></div>`}
function renderSidebar(){return `<aside class="sidebar ${ui.sidebarOpen?'open':''}"><div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18V6l14 12V6"/><path d="M5 12h14" opacity=".45"/></svg></div><div class="brand-name">KAIROS<span class="brand-sub">MANAJEMEN PROYEK</span></div></div><div class="workspace-switch" data-action="toggle-workspace-menu" title="Ganti workspace"><span class="workspace-orb">${esc(workspaceInitials())}</span><span class="workspace-name"><strong>${esc(cloud.workspace?.name||'Kairos Demo')}</strong>${esc(cloud.ready?currentRoleName():cloud.useLocal?'Data lokal · browser':'Mode lokal · browser')}</span>${icon('down',13)}</div>${ui.workspaceMenuOpen?`<div class="workspace-menu">${cloud.workspaces.map(w=>`<button data-action="select-workspace" data-id="${esc(w.id)}" class="${w.id===cloud.workspaceId?'active':''}"><strong>${esc(w.name)}</strong><small>${esc(cloud.members.find(m=>m.workspace_id===w.id)?.role||'')}</small></button>`).join('')||'<div class="tiny-text">Belum ada workspace cloud.</div>'}<button data-action="open-cloud-settings">${icon('settings',12)} Pengaturan koneksi</button></div>`:''}<div class="nav-label">Ruang kerja</div><nav class="nav-list">${navButton('dashboard','Dashboard','grid')}${navButton('projects','Proyek','folder',activeProjectCount())}${navButton('waterfall','Waterfall','waterfall',activeProjectCount('waterfall'))}${navButton('agile','Agile','agile',activeProjectCount('agile'))}</nav><div class="nav-label">Manajemen</div><nav class="nav-list">${navButton('team','Tim & kapasitas','users')}${navButton('reports','Laporan','chart')}${navButton('settings','Pengaturan','settings')}</nav><div class="sidebar-spacer"></div><div class="sidebar-card"><span class="mini-label">Kesehatan proyek</span><strong>${activeProjectCount()} proyek aktif</strong><p>${db.tasks.filter(t=>t.status!=='Done'&&t.dueDate<TODAY_ISO).length} tugas perlu perhatian.</p><button data-view="reports">Lihat ringkasan ${icon('arrow',12)}</button></div><div class="user-profile">${avatar(currentUserName())}<div class="profile-meta"><strong>${esc(currentUserName())}</strong><span>${esc(currentRoleName())}</span></div>${cloud.ready?'<button class="logout-btn" data-action="sign-out-cloud" title="Keluar dari workspace">Keluar</button>':''}</div></aside>`}
function renderTopbar(){const overdue=db.tasks.filter(t=>t.status!=='Done'&&t.dueDate<TODAY_ISO).slice(0,4);const crit=db.risks.filter(r=>r.status!=='Closed'&&r.probability*r.impact>=16).slice(0,3);const notice=[...overdue.map(t=>({kind:'Tugas terlambat',text:t.title,pid:t.projectId})),...crit.map(r=>({kind:'Risiko kritis',text:r.title,pid:r.projectId}))].slice(0,5);const dateText=new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(TODAY);return `<header class="topbar"><button class="mobile-menu" data-action="toggle-sidebar" aria-label="Buka menu">${icon('menu',18)}</button><div class="search-wrap"><div class="search-box">${icon('search',15)}<input id="globalSearch" type="search" placeholder="Cari proyek, tugas, risiko…" value="${esc(ui.searchText)}" autocomplete="off"><span class="search-shortcut">⌘ K</span></div><div class="search-results" id="searchResults"></div></div><div class="topbar-spacer"></div><span class="topbar-date">${dateText}</span>${cloud.ready?`${cloudBadge()}<button class="icon-button" data-action="sync-now" title="Sinkronkan sekarang" aria-label="Sinkronkan sekarang">${icon('refresh',15)}</button>`:cloudConfigured()&&!cloud.useLocal?cloudBadge():''}<div style="position:relative"><button class="icon-button" data-action="toggle-notifications" aria-label="Notifikasi">${icon('bell',16)}${notice.length?'<span class="notification-dot"></span>':''}</button><div class="notification-pop ${ui.notificationsOpen?'open':''}"><div class="notification-head"><strong>Perlu perhatian</strong><span class="chip">${notice.length} item</span></div>${notice.length?notice.map(n=>`<div class="notification-item"><b>${esc(n.kind)}:</b> ${esc(n.text)}<br><button data-action="open-project" data-id="${esc(n.pid)}">Buka proyek ${icon('arrow',10)}</button></div>`).join(''):'<div class="tiny-text">Tidak ada notifikasi baru.</div>'}</div></div><button class="top-primary" data-action="new-project">${icon('plus',15)}<span>Proyek baru</span></button></header>`}
function render(){if(cloudConfigured()&&!cloud.useLocal&&!cloud.ready){app.innerHTML=renderAuthScreen();return}const pages={dashboard:renderDashboard,projects:renderProjects,waterfall:renderWaterfall,agile:renderAgile,team:renderTeam,reports:renderReports,settings:renderSettings,'project-detail':renderProjectDetail};const page=(pages[ui.view]||renderDashboard)();app.innerHTML=`<div class="app-shell">${renderSidebar()}<div class="mobile-overlay ${ui.sidebarOpen?'show':''}" data-action="close-sidebar"></div><section class="main-area">${renderTopbar()}<main class="main-content" id="mainContent">${page}</main></section></div>${renderModal()}`;if(cloud.ready&&cloud.role==='stakeholder'){app.querySelectorAll('[data-action]').forEach(el=>{if(canEditAction(el.dataset.action)){el.setAttribute('aria-disabled','true');if('disabled'in el)el.disabled=true;else el.style.pointerEvents='none'}});app.querySelectorAll('[data-change]').forEach(el=>{if(['task-status','risk-status','issue-status','milestone-status','change-status','workflow-name','workday','permission','cloud-member-role'].includes(el.dataset.change))el.disabled=true});app.querySelectorAll('form[data-form] button[type="submit"]').forEach(el=>el.disabled=true)}}
function heading(title,subtitle,actions='',eyebrow='MANAJEMEN PROYEK'){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${subtitle}</p></div><div class="heading-actions">${actions}</div></div>`}
function progressChart(projects){const list=projects.slice(0,6);if(!list.length)return `<div class="empty-state">Belum ada proyek untuk ditampilkan.</div>`;const height=list.length*38+12;let svg=`<svg class="progress-chart" viewBox="0 0 560 ${height}" role="img" aria-label="Perbandingan progres aktual dan rencana proyek">`;list.forEach((p,i)=>{const y=16+i*38;const name=p.name.length>21?p.name.slice(0,19)+'…':p.name;const width=220;svg+=`<text x="0" y="${y+4}" fill="#728098" font-size="9" font-family="system-ui">${esc(name)}</text><rect x="168" y="${y-7}" width="${width}" height="7" rx="4" fill="#edf0f5"/><rect x="168" y="${y-7}" width="${width*p.plannedProgress/100}" height="7" rx="4" fill="#d9dce8"/><rect x="168" y="${y+4}" width="${width}" height="7" rx="4" fill="#f1f2f6"/><rect x="168" y="${y+4}" width="${width*p.actualProgress/100}" height="7" rx="4" fill="#7667e9"/><text x="405" y="${y+10}" fill="#55627a" font-size="9" font-weight="700" font-family="system-ui">${Math.round(p.actualProgress)}%</text><text x="446" y="${y+10}" fill="#a1aab8" font-size="8" font-family="system-ui">aktual</text>`});svg+='</svg>';return svg}
function projectTableRows(rows,actionColumn=true){if(!rows.length)return `<tr><td colspan="8"><div class="empty-state">${icon('folder',22)}<strong>Belum ada proyek yang cocok</strong><span>Ubah filter atau buat proyek baru untuk memulai.</span></div></td></tr>`;return rows.map(p=>{const h=health(p);return `<tr><td><div class="project-cell">${projectMark(p)}<div><strong>${esc(p.name)}</strong><span>${esc(p.code)} · ${esc(p.manager)}</span></div></div></td><td>${methodologyTag(p.methodology)}</td><td>${statusPill(h)}</td><td>${priorityTag(p.priority)}</td><td>${progressBar(p.actualProgress,p.plannedProgress)}</td><td>${fmtDate(p.dueDate,{day:'numeric',month:'short'})}</td><td>${fmtMoney(p.budget,true)}</td>${actionColumn?`<td><button class="row-action" title="Buka proyek" data-action="open-project" data-id="${p.id}">${icon('chev',15)}</button></td>`:''}</tr>`}).join('')}
function healthDonut(projects){const n=projects.length||1;const counts={'On track':0,'At risk':0,'Delayed':0};projects.forEach(p=>counts[health(p)]++);const g=counts['On track']/n*100,a=counts['At risk']/n*100;const c=`conic-gradient(#2eb89a 0 ${g}%, #e2a332 ${g}% ${g+a}%, #e26565 ${g+a}% 100%)`;return `<div class="donut" style="background:${c}"><div class="donut-center"><strong>${projects.length}</strong><span>proyek aktif</span></div></div><div class="health-legend">${[['On track','#2eb89a'],['At risk','#e2a332'],['Delayed','#e26565']].map(([k,col])=>`<div><div class="health-row"><span class="legend-dot" style="background:${col}"></span>${esc(uiLabel(k))}<b>${counts[k]}</b></div><div class="health-bar"><span style="width:${projects.length?counts[k]/projects.length*100:0}%;background:${col}"></span></div></div>`).join('')}</div>`}
function renderDashboard(){const projects=activeProjects();const total=projects.length;const avg=total?Math.round(projects.reduce((s,p)=>s+(Number(p.actualProgress)||0),0)/total):0;const planned=total?Math.round(projects.reduce((s,p)=>s+(Number(p.plannedProgress)||0),0)/total):0;const budget=projects.reduce((s,p)=>s+(Number(p.budget)||0),0),spent=projects.reduce((s,p)=>s+(Number(p.actualCost)||0),0);const ontrack=projects.filter(p=>health(p)==='On track').length;const overdue=db.tasks.filter(t=>t.status!=='Done'&&t.dueDate<TODAY_ISO).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));const critical=db.risks.filter(r=>r.status!=='Closed'&&r.probability*r.impact>=16).sort((a,b)=>b.probability*b.impact-a.probability*a.impact);const openIssues=db.issues.filter(i=>!['Resolved','Closed'].includes(i.status));const soon=db.tasks.filter(t=>t.status!=='Done'&&t.dueDate>=TODAY_ISO&&t.dueDate<=dateOffset(TODAY_ISO,7)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,4);const watch=[...overdue.slice(0,2).map(t=>({icon:'clock',tone:'red',kind:'Tugas terlambat',title:t.title,meta:`${getProject(t.projectId)?.name||''} · ${t.assignee}`,date:fmtDate(t.dueDate,{day:'numeric',month:'short'}),pid:t.projectId})),...critical.slice(0,2).map(r=>({icon:'warning',tone:'red',kind:'Risiko kritis · skor '+r.probability*r.impact,title:r.title,meta:`${getProject(r.projectId)?.name||''} · Owner ${r.owner}`,date:fmtDate(r.dueDate,{day:'numeric',month:'short'}),pid:r.projectId})),...openIssues.slice(0,1).map(i=>({icon:'flag',tone:'blue',kind:'Issue terbuka',title:i.title,meta:`${getProject(i.projectId)?.name||''} · ${i.owner}`,date:fmtDate(i.dueDate,{day:'numeric',month:'short'}),pid:i.projectId}))].slice(0,4);const actions=`<button class="btn" data-view="projects">${icon('folder',14)} Semua proyek</button><button class="btn primary" data-action="new-project">${icon('plus',14)} Proyek baru</button>`;return `${heading(`Selamat pagi, ${currentUserName()}`, 'Berikut ringkasan portofolio dan hal yang perlu mendapat perhatian hari ini.',actions,new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(TODAY).toUpperCase())}<div class="stats-grid"><div class="card stat-card"><div class="stat-top">Proyek aktif<span class="stat-icon purple">${icon('folder',16)}</span></div><div class="stat-value">${total}</div><div class="stat-foot"><span class="delta-up">${activeProjectCount('waterfall')} Waterfall</span> · ${activeProjectCount('agile')} Agile</div></div><div class="card stat-card"><div class="stat-top">Progres portofolio<span class="stat-icon green">${icon('target',16)}</span></div><div class="stat-value">${avg}%</div><div class="stat-foot"><span class="${avg>=planned?'delta-up':'delta-down'}">${avg>=planned?'+':'−'}${Math.abs(avg-planned)}%</span> vs rencana ${planned}%</div></div><div class="card stat-card"><div class="stat-top">Proyek sesuai jalur<span class="stat-icon blue">${icon('spark',16)}</span></div><div class="stat-value">${ontrack}<span style="font-size:12px;color:#9aa3b2;font-weight:550"> / ${total}</span></div><div class="stat-foot">${total?Math.round(ontrack/total*100):0}% proyek berstatus on track</div></div><div class="card stat-card"><div class="stat-top">Anggaran terpakai<span class="stat-icon orange">${icon('money',16)}</span></div><div class="stat-value">${budget?Math.round(spent/budget*100):0}%</div><div class="stat-foot">${fmtMoney(spent,true)} dari ${fmtMoney(budget,true)}</div></div></div><div class="dashboard-grid"><section class="card chart-card"><div class="section-title"><div><h2>Progres rencana vs aktual</h2><p>Perbandingan progres per proyek</p></div><div class="chart-legend"><span><i class="legend-dot" style="background:#d9dce8"></i>Rencana</span><span><i class="legend-dot" style="background:#7667e9"></i>Aktual</span></div></div>${progressChart(projects)}</section><section class="card chart-card"><div class="section-title"><div><h2>Kesehatan portofolio</h2><p>Distribusi status proyek</p></div><button class="link-button" data-view="projects">Detail ${icon('arrow',11)}</button></div><div class="health-wrap">${healthDonut(projects)}</div></section></div><div class="attention-grid"><section class="card card-pad"><div class="section-title"><div><h2>Butuh perhatian</h2><p>${overdue.length} tugas terlambat · ${critical.length} risiko kritis · ${openIssues.length} issue terbuka</p></div><button class="link-button" data-action="open-project" data-id="${watch[0]?.pid||'p1'}">Lihat detail ${icon('arrow',11)}</button></div><div class="attention-list">${watch.length?watch.map(w=>`<div class="attention-item"><span class="attention-marker ${w.tone}">${icon(w.icon,13)}</span><div class="attention-main"><strong>${esc(w.title)}</strong><span>${esc(w.kind)} · ${esc(w.meta)}</span></div><span class="attention-date">${w.date}</span></div>`).join(''):'<div class="empty-state"><strong>Semua terlihat terkendali</strong><span>Belum ada item prioritas tinggi.</span></div>'}</div></section><section class="card card-pad"><div class="section-title"><div><h2>Jatuh tempo 7 hari ke depan</h2><p>Fokus pekerjaan yang mendekati tenggat</p></div><span class="chip">${soon.length} tugas</span></div><div class="attention-list">${soon.length?soon.map(t=>`<div class="attention-item"><span class="attention-marker blue">${icon('calendar',13)}</span><div class="attention-main"><strong>${esc(t.title)}</strong><span>${esc(getProject(t.projectId)?.name||'')} · ${esc(t.assignee||'Belum ditugaskan')}</span></div><span class="attention-date">${fmtDate(t.dueDate,{day:'numeric',month:'short'})}</span></div>`).join(''):'<div class="empty-state"><strong>Tidak ada tenggat dekat</strong><span>Daftar pekerjaan yang jatuh tempo akan tampil di sini.</span></div>'}</div></section></div><section class="card table-card"><div class="table-top"><div><h2>Proyek yang sedang berjalan</h2><p class="tiny-text" style="margin:4px 0 0">Status, progres, dan target penyelesaian portofolio</p></div><button class="link-button" data-view="projects">Buka daftar proyek ${icon('arrow',11)}</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Proyek / PM</th><th>Metodologi</th><th>Kesehatan</th><th>Prioritas</th><th>Progres</th><th>Target selesai</th><th>Anggaran</th><th></th></tr></thead><tbody>${projectTableRows(projects.slice().sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,6))}</tbody></table></div></section>`}
function renderProjects(){let rows=activeProjects();const f=ui.projectFilters;if(f.method!=='all')rows=rows.filter(p=>p.methodology===f.method);if(f.status!=='all')rows=rows.filter(p=>health(p)===f.status);if(f.search)rows=rows.filter(p=>`${p.name} ${p.code} ${p.manager}`.toLowerCase().includes(f.search.toLowerCase()));rows.sort((a,b)=>f.sort==='progress'?b.actualProgress-a.actualProgress:f.sort==='name'?a.name.localeCompare(b.name):a.dueDate.localeCompare(b.dueDate));const actions=`<button class="btn" data-action="show-archive">${icon('file',14)} Arsip (${db.projects.filter(p=>p.archived).length})</button><button class="btn primary" data-action="new-project">${icon('plus',14)} Proyek baru</button>`;return `${heading('Semua proyek','Kelola proyek Waterfall dan Agile dalam satu portfolio.',actions)}<section class="card table-card"><div class="filter-bar"><div class="filter-row"><input class="field-input" type="search" placeholder="Cari nama proyek atau PM…" value="${esc(f.search)}" data-change="project-search"><select class="select" data-change="project-method"><option value="all" ${f.method==='all'?'selected':''}>Semua metodologi</option><option value="waterfall" ${f.method==='waterfall'?'selected':''}>Waterfall</option><option value="agile" ${f.method==='agile'?'selected':''}>Agile</option></select><select class="select" data-change="project-status"><option value="all">Semua status</option><option value="On track" ${f.status==='On track'?'selected':''}>Sesuai rencana</option><option value="At risk" ${f.status==='At risk'?'selected':''}>Berisiko</option><option value="Delayed" ${f.status==='Delayed'?'selected':''}>Terlambat</option><option value="Completed" ${f.status==='Completed'?'selected':''}>Selesai</option></select></div><div class="filter-row"><span class="tiny-text">Urutkan</span><select class="select" data-change="project-sort"><option value="due" ${f.sort==='due'?'selected':''}>Target selesai</option><option value="progress" ${f.sort==='progress'?'selected':''}>Progres tertinggi</option><option value="name" ${f.sort==='name'?'selected':''}>Nama proyek</option></select><span class="chip">${rows.length} proyek</span></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Proyek / PM</th><th>Metodologi</th><th>Kesehatan</th><th>Prioritas</th><th>Progres aktual / rencana</th><th>Target selesai</th><th>Anggaran</th><th></th></tr></thead><tbody>${projectTableRows(rows)}</tbody></table></div></section><div class="page-grid-2" style="margin-top:14px"><section class="card card-pad"><div class="section-title"><div><h2>Ringkasan metode</h2><p>Jumlah proyek berdasarkan kerangka kerja</p></div></div><div class="metric-inline"><div><strong>${activeProjectCount('waterfall')}</strong><span>Waterfall</span></div><div><strong>${activeProjectCount('agile')}</strong><span>Agile</span></div><div><strong>${activeProjects().filter(p=>p.status==='On Hold').length}</strong><span>Ditahan</span></div><div><strong>${db.projects.filter(p=>p.archived).length}</strong><span>Diarsipkan</span></div></div></section><section class="card card-pad"><div class="section-title"><div><h2>Catatan portfolio</h2><p>Gunakan detail proyek untuk kontrol dan keputusan</p></div>${icon('spark',17)}</div><div class="report-note">Proyek berstatus <b>At risk</b> atau <b>Delayed</b> ditentukan dari progres aktual vs rencana serta indeks CPI/SPI. Buka detail proyek untuk melihat EVM, risiko, dan tindakan mitigasi.</div></section></div>`}
function methodProjects(method){return activeProjects().filter(p=>p.methodology===method)}
function projectSelect(method,selected,change){const list=methodProjects(method);return `<select class="select project-switch" data-change="${change}">${list.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`}
function taskTable(tasks,mode='generic'){if(!tasks.length)return `<div class="empty-state">${icon('checklist',22)}<strong>Belum ada pekerjaan</strong><span>Tambahkan task untuk mulai mengelola progres dan PIC.</span></div>`;return `<div class="table-wrap"><table class="data-table"><thead><tr><th>ID / Tugas</th><th>${mode==='agile'?'Jenis':'Fase'}</th><th>PIC</th><th>Prioritas</th><th>Status</th><th>${mode==='agile'?'Points':'Deadline'}</th><th>Dependensi</th><th></th></tr></thead><tbody>${tasks.map((t,i)=>{const dep=(t.dependencies||[]).map(id=>getTask(id)?.title).filter(Boolean).join(', ');return `<tr><td><div style="font-weight:700;color:#35425b;font-size:9px">${esc(t.title)}</div><span class="tiny-text">${esc(t.key||`WBS-${String(i+1).padStart(2,'0')}`)}${t.critical?' · Critical path':''}</span></td><td>${mode==='agile'?`<span class="task-type">${esc(uiLabel(t.type||'Task'))}</span>`:`<span class="chip">${esc(uiLabel(t.phase||'—'))}</span>`}</td><td><div class="member-cell">${avatar(t.assignee||'')}</div></td><td>${priorityTag(t.priority)}</td><td><select class="status-select" data-change="task-status" data-id="${t.id}">${TASK_STATUSES.map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${esc(uiLabel(s))}</option>`).join('')}</select></td><td>${mode==='agile'?`<span class="chip">${Number(t.points)||0} SP</span>`:fmtDate(t.dueDate,{day:'numeric',month:'short',year:'numeric'})}</td><td><span class="tiny-text" title="${esc(dep)}">${dep?esc(dep.slice(0,28))+(dep.length>28?'…':''):'—'}</span></td><td><button class="row-action" data-action="edit-task" data-id="${t.id}" title="Edit">${icon('edit',13)}</button><button class="row-action" data-action="delete-task" data-id="${t.id}" title="Hapus">${icon('trash',13)}</button></td></tr>`}).join('')}</tbody></table></div>`}
function phaseStepper(p){const v=Number(p.actualProgress)||0;const idx=v>=98?6:v>=82?5:v>=66?4:v>=38?3:v>=23?2:v>=10?1:0;return `<div class="phase-ribbon">${PHASES.map((ph,i)=>`<div class="phase-step ${i<idx?'done':i===idx?'current':''}"><div class="phase-dot">${i<idx?icon('check',11):i+1}</div><strong>${esc(uiLabel(ph))}</strong><small>${i<idx?'Selesai':i===idx?'Fase berjalan':''}</small></div>`).join('')}</div>`}
function ganttMarkup(p,tasks){const start=new Date(`${p.startDate||TODAY_ISO}T12:00:00`),end=new Date(`${p.dueDate||dateOffset(TODAY_ISO,90)}T12:00:00`);const span=Math.max(1,end-start);const monthHeads=Array.from({length:6},(_,i)=>new Intl.DateTimeFormat('id-ID',{month:'short'}).format(new Date(start.getTime()+span*(i/6))));const one=(t,i,milestone=false)=>{const due=new Date(`${(t.dueDate||p.dueDate)}T12:00:00`);const from=milestone?due:(t.startDate?new Date(`${t.startDate}T12:00:00`):new Date(Math.max(start.getTime(),due.getTime()-Math.max(4,(Number(t.estimateHours)||24)/8*86400000))));const left=Math.max(0,Math.min(100,(from-start)/span*100));const right=Math.max(left+3,Math.min(100,(due-start)/span*100));return `<div class="gantt-row"><div class="gantt-name"><b>${milestone?'◆':(t.critical?'◆':String(i+1).padStart(2,'0'))}</b>${esc(t.title)}</div><div class="gantt-track">${monthHeads.map(()=>'<i class="gantt-cell"></i>').join('')}<span class="gantt-bar ${milestone?'milestone':t.status==='Done'?'done':t.critical?'critical':''}" title="${milestone?'Milestone · ':''}${esc(t.title)} · ${fmtDate(t.dueDate)}" style="left:${left}%;width:${milestone?'11px':Math.max(3,right-left)+'%'}"></span></div></div>`};const rows=tasks.slice(0,9).map((t,i)=>one(t,i)).join('');const ms=db.milestones.filter(m=>m.projectId===p.id).map((m,i)=>one(m,i,true)).join('');return `<div class="gantt"><div class="gantt-header"><div>Aktivitas / milestone</div>${monthHeads.map(m=>`<div>${esc(m)}</div>`).join('')}</div>${rows}${ms}</div><div class="gantt-legend"><span><i></i>Aktivitas</span><span><i class="red"></i>Critical path</span><span><i class="amber"></i>Milestone</span><span>Baseline: ${fmtDate(p.startDate,{month:'short',year:'numeric'})} – ${fmtDate(p.dueDate,{month:'short',year:'numeric'})}</span></div>`}
function milestoneTable(pid){const list=db.milestones.filter(m=>m.projectId===pid).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));return list.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Milestone / deliverable</th><th>Target date</th><th>Status</th><th></th></tr></thead><tbody>${list.map(m=>`<tr><td><b>${esc(m.title)}</b></td><td>${fmtDate(m.dueDate)}</td><td><select class="status-select" data-change="milestone-status" data-id="${m.id}">${['Planned','In Progress','Done','At Risk'].map(s=>`<option value="${s}" ${m.status===s?'selected':''}>${esc(uiLabel(s))}</option>`).join('')}</select></td><td><button class="row-action" data-action="edit-milestone" data-id="${m.id}">${icon('edit',12)}</button><button class="row-action" data-action="delete-milestone" data-id="${m.id}">${icon('trash',12)}</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><strong>Belum ada milestone</strong><span>Tambahkan milestone target.</span></div>'}
function renderRequirements(pid){const list=db.requirements.filter(q=>q.projectId===pid);return `<section class="card table-card"><div class="toolbar"><div class="toolbar-left"><h3>Requirement tracking & approval</h3><span class="chip">${list.length} requirement</span></div><button class="btn primary tiny" data-action="new-requirement" data-project="${pid}">${icon('plus',12)} Requirement</button></div>${list.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>ID / Requirement</th><th>Penanggung jawab</th><th>Acceptance criteria</th><th>Status</th><th>Approver</th><th></th></tr></thead><tbody>${list.map(q=>`<tr><td><b style="font-size:8px;color:#8d83d8">${esc(q.key)}</b><div style="font-size:9px;color:#43506a;margin-top:3px">${esc(q.title)}</div></td><td>${esc(q.owner)}</td><td class="tiny-text" style="max-width:260px">${esc(q.acceptance)}</td><td><span class="requirement-status ${q.status==='Approved'?'approved':q.status==='In Review'?'review':''}">${esc(q.status)}</span></td><td>${esc(q.approver||'—')}</td><td>${q.status!=='Approved'?`<button class="btn tiny" data-action="approve-requirement" data-id="${q.id}">${icon('check',11)} Setujui</button>`:''}<button class="row-action" data-action="edit-requirement" data-id="${q.id}" title="Edit">${icon('edit',12)}</button><button class="row-action" data-action="delete-requirement" data-id="${q.id}" title="Hapus">${icon('trash',12)}</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><strong>Requirement belum dicatat</strong><span>Tambahkan requirement dan approval per fase.</span></div>'}</section>`}
function renderDocuments(pid){const docs=db.documents.filter(d=>d.projectId===pid);return `<section class="card table-card"><div class="toolbar"><div class="toolbar-left"><h3>Dokumen, notulen & sign-off</h3><span class="chip">${docs.length} dokumen</span></div><button class="btn primary tiny" data-action="new-document" data-project="${pid}">${icon('plus',12)} Catat dokumen</button></div>${docs.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Dokumen</th><th>Kategori</th><th>Penanggung jawab</th><th>Tanggal</th><th>Sign-off</th><th></th></tr></thead><tbody>${docs.map(d=>`<tr><td><div class="member-cell">${icon('file',14)}<b>${esc(d.title)}</b></div>${d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener" class="tiny-text">Buka tautan</a>`:''}</td><td>${esc(d.category)}</td><td>${esc(d.owner)}</td><td>${fmtDate(d.date)}</td><td><span class="requirement-status ${d.status==='Approved'?'approved':d.status==='In Review'?'review':''}">${esc(d.status)}</span></td><td><button class="btn tiny" data-action="signoff-document" data-id="${d.id}">${d.status==='Approved'?'Ubah status':'Setujui'}</button><button class="row-action" data-action="edit-document" data-id="${d.id}" title="Edit">${icon('edit',12)}</button><button class="row-action" data-action="delete-document" data-id="${d.id}" title="Hapus">${icon('trash',12)}</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><strong>Belum ada dokumen</strong><span>Catat notulen rapat, dokumen proyek, atau sign-off.</span></div>'}</section>`}
function renderWaterfall(){const list=methodProjects('waterfall');if(!list.length)return `${heading('Waterfall','Modul khusus fase, baseline, milestone, dan persetujuan.',`<button class="btn primary" data-action="new-project" data-method="waterfall">${icon('plus',14)} Proyek Waterfall</button>`)}<div class="empty-state card"><strong>Belum ada proyek Waterfall aktif</strong><span>Buat proyek baru dengan metodologi Waterfall untuk memulai.</span></div>`;let p=list.find(x=>x.id===ui.currentProjectId)||list[0];ui.currentProjectId=p.id;const tasks=projectTasks(p.id);const tabs=[['tasks','WBS & tugas'],['timeline','Timeline / Gantt'],['requirements','Requirements'],['documents','Dokumen & sign-off']];const actions=`${projectSelect('waterfall',p.id,'waterfall-project')}<button class="btn primary" data-action="new-task" data-project="${p.id}">${icon('plus',13)} Tambah task</button>`;let inner='';if(ui.waterfallTab==='tasks')inner=`<section class="card card-pad" style="margin-bottom:14px"><div class="section-title"><div><h2>Progress fase proyek</h2><p>Current phase dihitung dari progres aktual proyek.</p></div><span class="chip">${Math.round(p.actualProgress)}% selesai</span></div>${phaseStepper(p)}<div class="info-grid"><div class="info-block"><label>Piagam proyek · tujuan</label><p>${esc(p.objective||'Tujuan belum diisi.')}</p></div><div class="info-block"><label>Scope & deliverables</label><p>${esc(p.scope||'Scope belum diisi.')}<br><b>Deliverables:</b> ${esc(p.deliverables||'Belum ditentukan.')}</p></div></div></section><section class="card table-card"><div class="toolbar"><div class="toolbar-left"><h3>Work Breakdown Structure</h3><span class="chip">${tasks.length} aktivitas</span><span class="chip">${tasks.filter(t=>t.critical).length} critical path</span></div><div class="toolbar-right"><button class="btn tiny" data-action="new-milestone" data-project="${p.id}">${icon('flag',12)} Milestone</button><button class="btn tiny" data-action="edit-project" data-id="${p.id}">${icon('edit',12)} Edit charter</button></div></div>${taskTable(tasks,'waterfall')}</section>`;else if(ui.waterfallTab==='timeline')inner=`<div class="page-grid-3"><div class="card mini-kpi"><span>Baseline jadwal</span><strong>${fmtDate(p.startDate,{day:'numeric',month:'short'})} — ${fmtDate(p.dueDate,{day:'numeric',month:'short'})}</strong><small>${health(p)==='Delayed'?'Perlu recovery plan':health(p)==='At risk'?'Ada deviasi terhadap baseline':'Sesuai baseline'}</small></div><div class="card mini-kpi"><span>Milestone berikutnya</span><strong>${esc(db.milestones.filter(m=>m.projectId===p.id&&m.status!=='Done').sort((a,b)=>a.dueDate.localeCompare(b.dueDate))[0]?.title||'Tidak ada')}</strong><small>${fmtDate(db.milestones.filter(m=>m.projectId===p.id&&m.status!=='Done').sort((a,b)=>a.dueDate.localeCompare(b.dueDate))[0]?.dueDate)}</small></div><div class="card mini-kpi"><span>Critical path</span><strong>${tasks.filter(t=>t.critical).length} aktivitas</strong><small>${tasks.filter(t=>t.critical&&t.status!=='Done').length} belum selesai</small></div></div><section class="card table-card"><div class="toolbar"><div><h3>Project timeline & dependency</h3><span class="tiny-text">Garis merah menandai pekerjaan critical path.</span></div><button class="btn tiny" data-action="new-milestone" data-project="${p.id}">${icon('plus',12)} Milestone</button></div>${ganttMarkup(p,tasks)}</section><section class="card table-card" style="margin-top:14px"><div class="toolbar"><div class="toolbar-left"><h3>Milestone & deliverables</h3><span class="chip">${db.milestones.filter(m=>m.projectId===p.id).length} milestone</span></div></div>${milestoneTable(p.id)}</section>`;else if(ui.waterfallTab==='requirements')inner=renderRequirements(p.id);else inner=renderDocuments(p.id);return `${heading('Ruang kerja Waterfall','Kendalikan fase, WBS, baseline jadwal, hasil kerja, dan persetujuan.',actions,'WATERFALL · '+esc(p.code))}<section class="card card-pad" style="padding-bottom:4px;margin-bottom:14px"><div class="detail-hero" style="margin:0 0 8px">${projectMark(p)}<div><h1 style="font-size:16px">${esc(p.name)}</h1><p>Project Manager ${esc(p.manager)} · ${fmtDate(p.startDate)} — ${fmtDate(p.dueDate)} · ${statusPill(health(p))}</p></div><div style="margin-left:auto">${methodologyTag('waterfall')}</div></div><div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${ui.waterfallTab===k?'active':''}" data-action="waterfall-tab" data-tab="${k}">${l}</button>`).join('')}</div></section>${inner}`}
function riskTable(pid){const list=db.risks.filter(r=>r.projectId===pid);if(!list.length)return '<div class="empty-state"><strong>Belum ada risiko tercatat</strong><span>Catat peluang, dampak, mitigasi, dan owner.</span></div>';return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Risiko</th><th>P×I</th><th>Rencana mitigasi</th><th>Penanggung jawab</th><th>Due date</th><th>Status</th><th></th></tr></thead><tbody>${list.map(r=>{const score=r.probability*r.impact;return `<tr><td><b>${esc(r.title)}</b></td><td><span class="risk-score ${score<10?'low':score<16?'medium':''}">${score} · ${uiLabel(score>=16?'Critical':score>=10?'High':'Moderate')}</span></td><td style="max-width:250px" class="tiny-text">${esc(r.mitigation)}</td><td>${esc(r.owner)}</td><td>${fmtDate(r.dueDate)}</td><td><select class="status-select" data-change="risk-status" data-id="${r.id}">${['Open','Mitigating','Closed'].map(s=>`<option value="${s}" ${r.status===s?'selected':''}>${esc(uiLabel(s))}</option>`).join('')}</select></td><td><button class="row-action" data-action="edit-risk" data-id="${r.id}">${icon('edit',12)}</button><button class="row-action" data-action="delete-risk" data-id="${r.id}">${icon('trash',12)}</button></td></tr>`}).join('')}</tbody></table></div>`}
function issueTable(pid){const list=db.issues.filter(i=>i.projectId===pid);if(!list.length)return '<div class="empty-state"><strong>Tidak ada issue tercatat</strong><span>Catat blocker, defect, dan kendala untuk ditindaklanjuti.</span></div>';return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Issue</th><th>Severity</th><th>Penanggung jawab</th><th>Deadline</th><th>Status</th><th></th></tr></thead><tbody>${list.map(i=>`<tr><td><b>${esc(i.title)}</b><div class="tiny-text">${esc(i.description||'')}</div></td><td><span class="risk-score ${i.severity==='Low'?'low':i.severity==='Medium'?'medium':''}">${esc(uiLabel(i.severity))}</span></td><td>${esc(i.owner)}</td><td>${fmtDate(i.dueDate)}</td><td><select class="status-select" data-change="issue-status" data-id="${i.id}">${['Open','In Progress','Resolved','Closed'].map(s=>`<option value="${s}" ${i.status===s?'selected':''}>${esc(uiLabel(s))}</option>`).join('')}</select></td><td><button class="row-action" data-action="edit-issue" data-id="${i.id}">${icon('edit',12)}</button><button class="row-action" data-action="delete-issue" data-id="${i.id}">${icon('trash',12)}</button></td></tr>`).join('')}</tbody></table></div>`}
function sprintFor(p,selected=''){const list=db.sprints.filter(s=>s.projectId===p.id);return list.find(s=>s.id===selected)||list.find(s=>s.id===p.activeSprintId)||list.find(s=>s.active)||list[0]||null}
function sprintTasks(s){return s?db.tasks.filter(t=>t.sprintId===s.id):[]}
function sprintMetrics(s){const tasks=sprintTasks(s);const total=tasks.reduce((a,t)=>a+(Number(t.points)||0),0);const done=tasks.filter(t=>t.status==='Done').reduce((a,t)=>a+(Number(t.points)||0),0);return {tasks,total,done,remaining:Math.max(0,total-done),count:tasks.length,completed:tasks.filter(t=>t.status==='Done').length}}
function renderSprintBanner(p,s){if(!s)return `<section class="card sprint-banner"><span class="sprint-icon">${icon('agile',20)}</span><div class="sprint-summary"><h2>Belum ada sprint</h2><p>Buat sprint untuk mulai merencanakan dan memantau kapasitas tim.</p></div><button class="btn primary" data-action="new-sprint" data-project="${p.id}">${icon('plus',13)} Buat sprint</button></section>`;const m=sprintMetrics(s),pct=m.count?Math.round(m.completed/m.count*100):0;return `<section class="card sprint-banner"><span class="sprint-icon">${icon('agile',20)}</span><div class="sprint-summary"><h2>${esc(s.name)} <span class="chip">${s.active?'Aktif':'Sprint'}</span></h2><p>${esc(s.goal)} · ${fmtDate(s.startDate,{day:'numeric',month:'short'})}–${fmtDate(s.endDate,{day:'numeric',month:'short'})}</p></div><div class="sprint-progress">${progressBar(pct,null,true)}<div class="tiny-text">${m.completed}/${m.count} story selesai · ${m.done}/${m.total} SP</div></div><div class="sprint-stats"><div class="sprint-stat"><strong>${m.total}</strong><span>Committed SP</span></div><div class="sprint-stat"><strong>${s.capacity}</strong><span>Capacity</span></div></div><span style="display:flex;gap:2px"><button class="row-action" title="Edit sprint" data-action="edit-sprint" data-id="${s.id}">${icon('edit',14)}</button><button class="row-action" title="Hapus sprint" data-action="delete-sprint" data-id="${s.id}">${icon('trash',14)}</button><button class="row-action" title="Buat sprint baru" data-action="new-sprint" data-project="${p.id}">${icon('plus',16)}</button></span></section>`}
function agileCard(t){return `<article class="task-card" draggable="true" data-task-drag="${t.id}" data-action="edit-task" data-id="${t.id}"><div class="task-card-top"><span class="issue-key">${esc(t.key||'KAI-'+String(t.id).slice(-3))}</span><span class="task-type">${esc(uiLabel(t.type||'Task'))}</span></div><div class="task-card-title">${esc(t.title)}</div><div class="task-card-foot"><span class="task-meta">${esc(t.priority||'Medium')} · ${fmtDate(t.dueDate,{day:'numeric',month:'short'})}</span>${t.assignee?avatar(t.assignee,'sm'):''}<span class="story-point">${Number(t.points)||0}</span></div></article>`}
function agileBoard(p,s){const tasks=sprintTasks(s);const cols=(db.settings.agileColumns?.length?db.settings.agileColumns:DEFAULT_AGILE_COLUMNS).slice();if(tasks.some(t=>t.status==='Blocked')&&!cols.includes('Blocked'))cols.push('Blocked');return `<section class="card table-card"><div class="toolbar"><div class="toolbar-left"><h3>Scrum board</h3><span class="chip">Drag & drop untuk mengubah status</span></div><div class="toolbar-right"><button class="btn tiny" data-action="new-task" data-project="${p.id}" data-agile="true">${icon('plus',12)} User story</button><button class="btn tiny" data-action="configure-workflow">${icon('settings',12)} Kolom</button></div></div><div class="kanban-scroll"><div class="kanban-board">${cols.map(col=>{const laneTasks=tasks.filter(t=>t.status===col);const cls=col==='Done'?'done':col==='In Progress'?'progress':col==='Code Review'?'review':col==='Testing'?'testing':'';return `<div class="kanban-lane" data-lane="${esc(col)}"><div class="lane-head"><span class="lane-title"><i class="lane-dot ${cls}"></i>${esc(uiLabel(col))}</span><span class="lane-count">${laneTasks.length}</span></div>${laneTasks.map(agileCard).join('')}${!laneTasks.length?'<div class="tiny-text" style="padding:10px 4px">Drop item di sini</div>':''}</div>`}).join('')}</div></div></section>`}
function backlogTable(p,s){const list=db.tasks.filter(t=>t.projectId===p.id&&(!s||t.sprintId!==s.id||t.includeProgress===false));return `<section class="card table-card"><div class="toolbar"><div class="toolbar-left"><h3>Product backlog</h3><span class="chip">${list.length} item</span></div><button class="btn primary tiny" data-action="new-task" data-project="${p.id}" data-agile="true">${icon('plus',12)} Backlog item</button></div>${list.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Backlog item</th><th>Jenis</th><th>Prioritas</th><th>Story points</th><th>PIC</th><th>Target</th><th></th></tr></thead><tbody>${list.map(t=>`<tr><td><b>${esc(t.title)}</b><div class="tiny-text">${esc(t.key||'')} · ${esc(t.description||'')}</div></td><td><span class="task-type">${esc(t.type)}</span></td><td>${priorityTag(t.priority)}</td><td>${Number(t.points)||0}</td><td>${esc(t.assignee||'—')}</td><td>${fmtDate(t.dueDate)}</td><td><button class="btn tiny" data-action="add-to-sprint" data-id="${t.id}" data-sprint="${s?.id||''}" ${s?'':'disabled'}>${icon('plus',11)} Ke sprint</button><button class="row-action" data-action="edit-task" data-id="${t.id}">${icon('edit',12)}</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><strong>Product backlog kosong</strong><span>Tambahkan epic, user story, task, bug, atau subtask.</span></div>'}</section>`}
function burndownChart(s){const m=sprintMetrics(s),total=Math.max(1,m.total),width=560,height=205,left=42,right=14,top=14,bottom=30,plotW=width-left-right,plotH=height-top-bottom,days=8;const current=Math.max(0,Math.min(days-1,Math.floor((new Date(`${TODAY_ISO}T12:00:00`)-new Date(`${s.startDate}T12:00:00`))/86400000)));const ideal=Array.from({length:days},(_,i)=>total*(1-i/(days-1)));const actual=Array.from({length:days},(_,i)=>i<=current?Math.max(0,total-(total-m.remaining)*(i/Math.max(1,current))):m.remaining);const pt=(arr,i)=>`${left+plotW*i/(days-1)},${top+plotH*(1-arr[i]/total)}`;return `<svg class="burndown-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Sprint burndown chart"><g stroke="#edf0f5" stroke-width="1">${[0,1,2,3].map(i=>`<line x1="${left}" y1="${top+plotH*i/3}" x2="${width-right}" y2="${top+plotH*i/3}"/>`).join('')}</g><g fill="#9aa4b3" font-size="9" font-family="system-ui">${[0,1,2,3].map(i=>`<text x="3" y="${top+plotH*i/3+3}">${Math.round(total*(1-i/3))} SP</text>`).join('')}${Array.from({length:days},(_,i)=>`<text x="${left+plotW*i/(days-1)-6}" y="${height-7}">H${i+1}</text>`).join('')}</g><polyline fill="none" stroke="#c9cbd6" stroke-width="2" stroke-dasharray="4 4" points="${ideal.map((_,i)=>pt(ideal,i)).join(' ')}"/><polyline fill="none" stroke="#7566e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${actual.map((_,i)=>pt(actual,i)).join(' ')}"/><circle cx="${left+plotW*current/(days-1)}" cy="${top+plotH*(1-m.remaining/total)}" r="4" fill="#7566e8" stroke="white" stroke-width="2"/></svg>`}
function velocityChart(p){const related=db.sprints.filter(s=>s.projectId===p.id).slice().sort((a,b)=>a.startDate.localeCompare(b.startDate));if(!related.length)return '<div class="empty-state"><strong>Belum ada data sprint</strong><span>Velocity akan dihitung setelah sprint dibuat dan story selesai.</span></div>';const vals=related.map(s=>sprintMetrics(s).done),max=Math.max(1,...vals);return `<div class="bar-chart">${related.map((s,i)=>`<div class="bar-row"><span>${esc(s.name)}</span><div class="bar-bg"><span class="${s.active?'alt':''}" style="width:${vals[i]/max*100}%"></span></div><b>${vals[i]} SP</b></div>`).join('')}</div>`}
function cumulativeFlow(p,s){const tasks=sprintTasks(s),cols=db.settings.agileColumns||DEFAULT_AGILE_COLUMNS;const counts=cols.map(c=>tasks.filter(t=>t.status===c).length);const max=Math.max(1,...counts);return `<div class="bar-chart">${cols.map((c,i)=>`<div class="bar-row"><span>${esc(c)}</span><div class="bar-bg"><span style="width:${counts[i]/max*100}%;background:${['#b4accf','#6496df','#9d8cdb','#e4ad48','#40b799'][i%5]}"></span></div><b>${counts[i]}</b></div>`).join('')}</div><p class="tiny-text">Snapshot status saat ini · ${tasks.length} sprint item</p>`}
function renderAgile(){const list=methodProjects('agile');if(!list.length)return `${heading('Ruang kerja Agile','Kelola backlog produk, pelaksanaan sprint, papan Scrum, dan ringkasan pengiriman.',`<button class="btn primary" data-action="new-project" data-method="agile">${icon('plus',14)} Proyek Agile</button>`)}<div class="empty-state card"><strong>Belum ada proyek Agile aktif</strong><span>Buat proyek Agile untuk mengelola backlog dan sprint.</span></div>`;let p=list.find(x=>x.id===ui.currentProjectId)||list[0];ui.currentProjectId=p.id;let s=sprintFor(p,ui.agileSprintId);if(s)ui.agileSprintId=s.id;const sprintOpts=db.sprints.filter(x=>x.projectId===p.id);const tabs=[['board','Scrum board'],['backlog','Product backlog'],['insights','Sprint insights'],['retro','Stand-up & retrospective']];const actions=`${projectSelect('agile',p.id,'agile-project')}<select class="select" data-change="agile-sprint">${sprintOpts.map(x=>`<option value="${x.id}" ${x.id===s?.id?'selected':''}>${esc(x.name)}${x.active?' · aktif':''}</option>`).join('')}${!sprintOpts.length?'<option value="">Belum ada sprint</option>':''}</select><button class="btn primary" data-action="new-sprint" data-project="${p.id}">${icon('plus',13)} Sprint</button>`;let inner='';if(ui.agileTab==='board')inner=agileBoard(p,s);else if(ui.agileTab==='backlog')inner=backlogTable(p,s);else if(ui.agileTab==='insights'){if(!s)inner='<div class="empty-state card"><strong>Buat sprint untuk melihat insight</strong></div>';else{const m=sprintMetrics(s);inner=`<div class="page-grid-3"><div class="card mini-kpi"><span>Completion</span><strong>${m.count?Math.round(m.completed/m.count*100):0}%</strong><small>${m.completed} dari ${m.count} user story selesai</small></div><div class="card mini-kpi"><span>Story points selesai</span><strong>${m.done} / ${m.total}</strong><small>${m.remaining} SP masih terbuka</small></div><div class="card mini-kpi"><span>Capacity utilization</span><strong>${s.capacity?Math.round(m.total/s.capacity*100):0}%</strong><small>${m.total} SP committed · ${s.capacity} SP capacity</small></div></div><div class="page-grid-2"><section class="card"><div class="card-pad"><div class="section-title"><div><h2>Sprint burndown</h2><p>Remaining story points · ideal vs aktual</p></div><div class="chart-legend"><span><i class="legend-dot" style="background:#7566e8"></i>Aktual</span><span><i class="legend-dot" style="background:#c9cbd6"></i>Ideal</span></div></div>${burndownChart(s)}</div></section><section class="card card-pad"><div class="section-title"><div><h2>Velocity</h2><p>Story points selesai per sprint</p></div></div>${velocityChart(p)}</section></div><div class="page-grid-2"><section class="card card-pad"><div class="section-title"><div><h2>Cumulative flow · snapshot</h2><p>Distribusi item berdasarkan status</p></div></div>${cumulativeFlow(p,s)}</section><section class="card table-card"><div class="toolbar"><div><h3>Impediment & defect</h3><span class="tiny-text">Issue yang menahan delivery sprint</span></div><button class="btn tiny" data-action="new-issue" data-project="${p.id}">${icon('plus',12)} Tambah issue</button></div>${issueTable(p.id)}</section></div>`}}else inner=renderRetro(p,s);return `${heading('Ruang kerja Agile','Kelola backlog produk, pelaksanaan sprint, papan Scrum, dan ringkasan pengiriman.',actions,'AGILE DELIVERY · '+esc(p.code))}<section class="card card-pad" style="padding-bottom:4px;margin-bottom:14px"><div class="detail-hero" style="margin:0 0 7px">${projectMark(p)}<div><h1 style="font-size:16px">${esc(p.name)}</h1><p>Product owner / PM ${esc(p.manager)} · Target release ${fmtDate(p.dueDate)} · ${statusPill(health(p))}</p></div><div style="margin-left:auto">${methodologyTag('agile')}</div></div><div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${ui.agileTab===k?'active':''}" data-action="agile-tab" data-tab="${k}">${l}</button>`).join('')}</div></section>${renderSprintBanner(p,s)}${inner}`}
function renderRetro(p,s){if(!s)return `<div class="empty-state card"><strong>Belum ada sprint</strong><span>Buat sprint terlebih dahulu untuk menulis stand-up dan retrospective.</span></div>`;const r=s.retrospective||{};const notes=db.standups.filter(n=>n.projectId===p.id&&n.sprintId===s.id).sort((a,b)=>b.date.localeCompare(a.date));const releases=db.releases.filter(x=>x.projectId===p.id);return `<div class="page-grid-2"><section class="card card-pad"><div class="section-title"><div><h2>Catatan daily stand-up</h2><p>${esc(s.name)} · progress, rencana, dan blocker harian</p></div><button class="btn primary tiny" data-action="new-standup" data-project="${p.id}" data-sprint="${s.id}">${icon('plus',12)} Catat stand-up</button></div>${notes.length?notes.map(n=>`<div class="info-block" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><b style="font-size:9px">${esc(n.member)} · ${fmtDate(n.date)}</b><span class="tiny-text">${esc(n.sprintId)}</span><span><button class="row-action" data-action="edit-standup" data-id="${n.id}" title="Edit">${icon('edit',11)}</button><button class="row-action" data-action="delete-standup" data-id="${n.id}" title="Hapus">${icon('trash',11)}</button></span></div><p style="margin-top:7px"><b>Kemarin:</b> ${esc(n.yesterday)}<br><b>Hari ini:</b> ${esc(n.today)}<br><b>Blocker:</b> ${esc(n.blocker||'Tidak ada')}</p></div>`).join(''):'<div class="empty-state"><strong>Belum ada catatan stand-up</strong></div>'}</section><section class="card card-pad"><div class="section-title"><div><h2>Retrospektif sprint</h2><p>Simpan hasil review agar action item terpantau.</p></div></div><form data-form="retro" data-id="${s.id}"><div class="form-field"><label>Apa yang berjalan baik</label><textarea class="field-textarea" name="wentWell">${esc(r.wentWell||'')}</textarea></div><div class="form-field" style="margin-top:9px"><label>Apa yang perlu diperbaiki</label><textarea class="field-textarea" name="improve">${esc(r.improve||'')}</textarea></div><div class="form-field" style="margin-top:9px"><label>Tindak lanjut</label><textarea class="field-textarea" name="actions">${esc(r.actions||'')}</textarea></div><button class="btn primary" style="margin-top:10px" type="submit">Simpan retrospective</button></form></section></div><div class="page-grid-2"><section class="card table-card"><div class="toolbar"><div><h3>Impediment & defect log</h3></div><button class="btn tiny" data-action="new-issue" data-project="${p.id}">${icon('plus',12)} Issue / impediment</button></div>${issueTable(p.id)}</section><section class="card card-pad"><div class="section-title"><div><h2>Perencanaan release</h2><p>Target dan sasaran release</p></div><button class="btn tiny" data-action="new-release" data-project="${p.id}">${icon('plus',12)} Release</button></div>${releases.length?releases.map(rel=>`<div class="release-card"><span class="release-flag">${icon('flag',14)}</span><div><strong>${esc(rel.name)}</strong><small>${fmtDate(rel.targetDate)} · ${esc(rel.goal)}</small></div><span class="status-pill ${rel.status==='Released'?'completed':'on-track'}">${esc(uiLabel(rel.status))}</span><span><button class="row-action" data-action="edit-release" data-id="${rel.id}" title="Edit">${icon('edit',11)}</button><button class="row-action" data-action="delete-release" data-id="${rel.id}" title="Hapus">${icon('trash',11)}</button></span></div>`).join(''):'<div class="empty-state"><strong>Belum ada target release</strong></div>'}</section></div>`}
function projectHealthStrip(p){const e=getEvm(p),crit=db.risks.filter(r=>r.projectId===p.id&&r.status!=='Closed'&&r.probability*r.impact>=16).length,open=db.issues.filter(i=>i.projectId===p.id&&!['Resolved','Closed'].includes(i.status)),scope=db.changes.filter(c=>c.projectId===p.id&&['Under Review','Pending'].includes(c.status)).length;const vals=[['Jadwal',e.spi===null?'—':e.spi>=.95?'On track':e.spi>=.85?'At risk':'Delayed',e.spi===null?'warn':e.spi>=.95?'good':e.spi>=.85?'warn':'bad'],['Biaya',e.cpi===null?'—':e.cpi>=.95?'On budget':e.cpi>=.85?'At risk':'Over budget',e.cpi===null?'warn':e.cpi>=.95?'good':e.cpi>=.85?'warn':'bad'],['Scope',scope?'Change review': 'Terkendali',scope?'warn':'good'],['Kualitas',open.length?`${open.length} issue terbuka`:'Terkendali',open.some(i=>i.severity==='High')?'bad':open.length?'warn':'good'],['Risiko',crit?`${crit} kritis`: 'Terkendali',crit?'bad':'good']];return `<div class="health-strip">${vals.map(([k,v,c])=>`<div class="health-segment"><span>${k}</span><strong class="${c}">${v}</strong></div>`).join('')}</div>`}
function renderProjectDetail(){const p=getProject(ui.currentProjectId);if(!p)return `${heading('Detail proyek','Proyek tidak ditemukan.',`<button class="btn" data-view="projects">Kembali ke proyek</button>`)}<div class="empty-state card"><strong>Proyek tidak ditemukan</strong></div>`;const tasks=projectTasks(p.id);const evm=getEvm(p);const tabs=[['overview','Ringkasan'],['work','Tugas & WBS'],['timeline','Timeline'],['risks','Risiko & issue'],['governance','Governance']];const actions=`<button class="btn" data-action="edit-project" data-id="${p.id}">${icon('edit',13)} Edit</button><button class="btn" data-action="archive-project" data-id="${p.id}">${icon('file',13)} ${p.archived?'Pulihkan':'Arsipkan'}</button>`;let body='';if(ui.detailTab==='overview')body=`<div class="stats-grid"><div class="card mini-kpi"><span>Progress aktual / rencana</span><strong>${Math.round(p.actualProgress)}% <small style="font-size:10px;color:#99a2b1">/ ${Math.round(p.plannedProgress)}%</small></strong><small>${Math.round(p.actualProgress-p.plannedProgress)}% varians progres</small></div><div class="card mini-kpi"><span>Schedule performance · SPI</span><strong>${evm.spi===null?'—':evm.spi.toFixed(2)}</strong><small>${fmtMoney(evm.sv,true)} schedule variance</small></div><div class="card mini-kpi"><span>Cost performance · CPI</span><strong>${evm.cpi===null?'—':evm.cpi.toFixed(2)}</strong><small>${fmtMoney(evm.cv,true)} cost variance</small></div><div class="card mini-kpi"><span>Forecast at completion</span><strong>${fmtMoney(evm.eac,true)}</strong><small>Baseline ${fmtMoney(evm.bac,true)}</small></div></div><div class="page-grid-2"><section class="card card-pad"><div class="section-title"><div><h2>Manajemen Nilai Hasil (EVM)</h2><p>PV, EV, dan AC dihitung dari baseline budget serta progres proyek.</p></div><span class="chip">${health(p)}</span></div><div class="evm-grid"><div class="evm-item"><span>PV</span><strong>${fmtMoney(evm.pv,true)}</strong></div><div class="evm-item"><span>EV</span>
